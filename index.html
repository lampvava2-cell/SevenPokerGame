<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>나무토막 연소 시뮬레이터</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0d0d0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .info-card {
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f0f0f0;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .btn-reset {
            pointer-events: auto;
            background: #282832;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-reset:active {
            background: #404050;
        }
        #status-pill {
            margin-top: 5px;
            font-weight: bold;
            color: #ffaa44;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <div class="info-card">
            <div>🔥 <b>화면 조작 안내</b></div>
            <div>• 1손가락 드래그: 카메라 회전</div>
            <div>• 2손가락 핀치: 확대 / 축소</div>
            <div>• 나무 표면 터치: <b>작은 불 붙이기</b></div>
            <div id="status-pill">상태: 점화 대기 중</div>
        </div>
        <button class="btn-reset" onclick="resetBlock()">새 나무로 리셋</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const statusPill = document.getElementById('status-pill');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e0e12);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.8, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.2;
        controls.maxDistance = 6.0;

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(2, 4, 3);
        scene.add(dirLight);

        const firePointLight = new THREE.PointLight(0xff5500, 0, 5, 2.0);
        scene.add(firePointLight);

        // 바닥 평면
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.9, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.6;
        scene.add(floor);

        // --- 연소 시뮬레이션 그리드 설정 ---
        const SIM_SIZE = 256;
        const simCanvas = document.createElement('canvas');
        simCanvas.width = SIM_SIZE;
        simCanvas.height = SIM_SIZE;
        const simCtx = simCanvas.getContext('2d');

        let tempGrid = new Float32Array(SIM_SIZE * SIM_SIZE);
        let nextTempGrid = new Float32Array(SIM_SIZE * SIM_SIZE);
        let fuelGrid = new Float32Array(SIM_SIZE * SIM_SIZE);
        let charGrid = new Float32Array(SIM_SIZE * SIM_SIZE);
        let isBurning = false;

        function initSimulationData() {
            for (let i = 0; i < SIM_SIZE * SIM_SIZE; i++) {
                tempGrid[i] = 0.0;
                fuelGrid[i] = 1.0; // 100% 연료
                charGrid[i] = 0.0; // 0% 탄화
            }
            isBurning = false;
            firePointLight.intensity = 0;
            statusPill.innerText = "상태: 점화 대기 중";
            statusPill.style.color = "#ffaa44";

            // 초기 캔버스를 R:0, G:255(연료 가득), B:0, A:0으로 채움
            const imgData = simCtx.createImageData(SIM_SIZE, SIM_SIZE);
            const data = imgData.data;
            for (let i = 0; i < SIM_SIZE * SIM_SIZE; i++) {
                data[i * 4] = 0;
                data[i * 4 + 1] = 255;
                data[i * 4 + 2] = 0;
                data[i * 4 + 3] = 0;
            }
            simCtx.putImageData(imgData, 0, 0);
        }
        initSimulationData();

        const simTexture = new THREE.CanvasTexture(simCanvas);
        simTexture.generateMipmaps = false;
        simTexture.minFilter = THREE.LinearFilter;
        simTexture.magFilter = THREE.LinearFilter;

        // 나뭇결 기본 텍스처
        const woodCanvas = document.createElement('canvas');
        woodCanvas.width = 512;
        woodCanvas.height = 512;
        const woodCtx = woodCanvas.getContext('2d');
        const woodGrad = woodCtx.createLinearGradient(0, 0, 512, 512);
        woodGrad.addColorStop(0, '#543622');
        woodGrad.addColorStop(0.5, '#754a2e');
        woodGrad.addColorStop(1, '#442817');
        woodCtx.fillStyle = woodGrad;
        woodCtx.fillRect(0, 0, 512, 512);
        woodCtx.fillStyle = 'rgba(25, 14, 8, 0.18)';
        for (let i = 0; i < 512; i += 4) {
            woodCtx.fillRect(0, i + Math.sin(i * 0.12) * 2, 512, 1.6);
        }
        const woodTexture = new THREE.CanvasTexture(woodCanvas);

        // --- 셰이더 (수축 방식 안정화: 중심축 축소 적용) ---
        const woodMaterial = new THREE.ShaderMaterial({
            uniforms: {
                _WoodTex: { value: woodTexture },
                _SimTex: { value: simTexture },
                _Shrink: { value: 0.12 }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                uniform sampler2D _SimTex;
                uniform float _Shrink;

                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    
                    vec4 sim = texture2D(_SimTex, uv);
                    float burned = clamp(1.0 - sim.g, 0.0, 1.0);

                    // 중심축(원점) 방향으로 수축시켜 모서리 찢어짐을 원천 방지
                    vec3 shrinkDir = normalize(position);
                    vec3 displacedPos = position - shrinkDir * (burned * _Shrink);

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPos, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D _WoodTex;
                uniform sampler2D _SimTex;
                varying vec2 vUv;
                varying vec3 vNormal;

                void main() {
                    vec4 woodCol = texture2D(_WoodTex, vUv);
                    vec4 sim = texture2D(_SimTex, vUv);
                    float temp = sim.r;
                    float fuel = sim.g;
                    float charAmount = sim.a;

                    // 탄화(숯) 변색
                    vec3 charCol = vec3(0.04, 0.04, 0.04);
                    vec3 baseCol = mix(woodCol.rgb, charCol, charAmount);

                    // 잉걸불(Glow) 에미시브
                    vec3 emberCol = vec3(2.8, 0.45, 0.02) * pow(temp, 2.2) * (fuel * 1.5 + 0.15);

                    vec3 lightDir = normalize(vec3(1.0, 2.0, 1.5));
                    float diff = max(dot(vNormal, lightDir), 0.2);

                    gl_FragColor = vec4(baseCol * diff + emberCol, 1.0);
                }
            `
        });

        const woodGeo = new THREE.BoxGeometry(1.6, 0.5, 0.5, 48, 24, 24);
        const woodBlock = new THREE.Mesh(woodGeo, woodMaterial);
        scene.add(woodBlock);

        // --- 파티클 시스템 ---
        const PARTICLE_COUNT = 500;
        const particleGeo = new THREE.BufferGeometry();
        const pPositions = new Float32Array(PARTICLE_COUNT * 3);
        const pColors = new Float32Array(PARTICLE_COUNT * 3);
        const pLifes = new Float32Array(PARTICLE_COUNT);
        const pMaxLifes = new Float32Array(PARTICLE_COUNT);
        const pVelocities = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            pPositions[i * 3 + 1] = -100;
            pLifes[i] = 1.0;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 0.13,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const fireParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(fireParticles);

        // --- 터치 입력 및 점화 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let touchStartX = 0, touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) {
                const deltaX = Math.abs(e.changedTouches[0].clientX - touchStartX);
                const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);

                if (deltaX < 12 && deltaY < 12) {
                    mouse.x = (e.changedTouches[0].clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.changedTouches[0].clientY / window.innerHeight) * 2 + 1;
                    igniteAtTouch();
                }
            }
        });

        function igniteAtTouch() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(woodBlock);
            if (intersects.length > 0) {
                const uv = intersects[0].uv;
                const cx = Math.floor(uv.x * SIM_SIZE);
                const cy = Math.floor(uv.y * SIM_SIZE);
                const radius = 10;

                for (let y = -radius; y <= radius; y++) {
                    for (let x = -radius; x <= radius; x++) {
                        const px = cx + x;
                        const py = cy + y;
                        if (px >= 0 && px < SIM_SIZE && py >= 0 && py < SIM_SIZE) {
                            if (x * x + y * y <= radius * radius) {
                                tempGrid[py * SIM_SIZE + px] = 1.0;
                            }
                        }
                    }
                }
                isBurning = true;
                statusPill.innerText = "상태: 연소 진행 중 🔥";
                statusPill.style.color = "#ff4422";
            }
        }

        // --- 연소 물리 연산 ---
        const DIFFUSION = 0.16;
        const BURN_RATE = 0.0035;
        const COOLING = 0.0016;
        const IGNITION_TEMP = 0.32;

        function stepCombustion() {
            let activeFlames = 0;
            let totalTemp = 0;
            let flameCenterX = 0, flameCenterY = 0, flameCount = 0;

            const imgData = simCtx.createImageData(SIM_SIZE, SIM_SIZE);
            const data = imgData.data;

            for (let y = 1; y < SIM_SIZE - 1; y++) {
                const row = y * SIM_SIZE;
                for (let x = 1; x < SIM_SIZE - 1; x++) {
                    const idx = row + x;
                    let temp = tempGrid[idx];
                    let fuel = fuelGrid[idx];
                    let ch = charGrid[idx];

                    // 확산 연산
                    const lap = (tempGrid[idx - 1] + tempGrid[idx + 1] + tempGrid[idx - SIM_SIZE] + tempGrid[idx + SIM_SIZE]) - (4.0 * temp);
                    temp += lap * DIFFUSION;

                    // 연소
                    if (temp > IGNITION_TEMP && fuel > 0.001) {
                        const reaction = Math.min(fuel, BURN_RATE);
                        fuel -= reaction;
                        temp += reaction * 1.8;
                        ch = Math.min(1.0, ch + reaction * 2.5);
                        activeFlames++;

                        flameCenterX += (x / SIM_SIZE - 0.5) * 1.6;
                        flameCenterY += (y / SIM_SIZE - 0.5) * 0.5;
                        flameCount++;
                    }

                    // 냉각
                    temp = Math.max(0.0, temp - COOLING);

                    nextTempGrid[idx] = temp;
                    fuelGrid[idx] = fuel;
                    charGrid[idx] = ch;
                    totalTemp += temp;

                    // 텍스처 픽셀 데이터
                    const pIdx = idx * 4;
                    data[pIdx]     = Math.floor(Math.min(temp, 1.0) * 255);
                    data[pIdx + 1] = Math.floor(fuel * 255);
                    data[pIdx + 2] = Math.floor((temp > IGNITION_TEMP ? fuel : 0) * 255);
                    data[pIdx + 3] = Math.floor(ch * 255);
                }
            }

            let swap = tempGrid;
            tempGrid = nextTempGrid;
            nextTempGrid = swap;

            simCtx.putImageData(imgData, 0, 0);
            simTexture.needsUpdate = true;

            // 광원 및 파티클 연동
            if (flameCount > 0) {
                firePointLight.intensity = THREE.MathUtils.lerp(firePointLight.intensity, Math.min(flameCount * 0.02, 3.5), 0.1);
                firePointLight.position.set(flameCenterX / flameCount, flameCenterY / flameCount + 0.3, 0);
                spawnFireParticles(flameCount);
            } else {
                firePointLight.intensity = THREE.MathUtils.lerp(firePointLight.intensity, 0, 0.05);
            }

            // 전소 판정
            if (isBurning && activeFlames === 0 && totalTemp < 8.0) {
                isBurning = false;
                statusPill.innerText = "상태: 완전 연소 후 불 꺼짐 💨";
                statusPill.style.color = "#888899";
            }
        }

        function spawnFireParticles(intensity) {
            const count = Math.min(Math.floor(intensity * 0.4), 8);
            for (let i = 0; i < count; i++) {
                const pIdx = Math.floor(Math.random() * PARTICLE_COUNT);
                if (pLifes[pIdx] >= 1.0) {
                    pLifes[pIdx] = 0.0;
                    pMaxLifes[pIdx] = 0.6 + Math.random() * 0.4;
                    
                    pPositions[pIdx * 3]     = firePointLight.position.x + (Math.random() - 0.5) * 0.35;
                    pPositions[pIdx * 3 + 1] = firePointLight.position.y - 0.1;
                    pPositions[pIdx * 3 + 2] = (Math.random() - 0.5) * 0.3;

                    pVelocities[pIdx * 3]     = (Math.random() - 0.5) * 0.25;
                    pVelocities[pIdx * 3 + 1] = 0.8 + Math.random() * 0.7;
                    pVelocities[pIdx * 3 + 2] = (Math.random() - 0.5) * 0.25;
                }
            }
        }

        function updateParticles(dt) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (pLifes[i] < 1.0) {
                    pLifes[i] += dt / pMaxLifes[i];
                    
                    pPositions[i * 3]     += pVelocities[i * 3] * dt;
                    pPositions[i * 3 + 1] += pVelocities[i * 3 + 1] * dt;
                    pPositions[i * 3 + 2] += pVelocities[i * 3 + 2] * dt;

                    const life = pLifes[i];
                    if (life < 0.4) {
                        pColors[i * 3] = 1.0; pColors[i * 3 + 1] = 0.85; pColors[i * 3 + 2] = 0.1;
                    } else if (life < 0.7) {
                        pColors[i * 3] = 0.9; pColors[i * 3 + 1] = 0.25; pColors[i * 3 + 2] = 0.02;
                    } else {
                        pColors[i * 3] = 0.12; pColors[i * 3 + 1] = 0.12; pColors[i * 3 + 2] = 0.12;
                    }
                } else {
                    pPositions[i * 3 + 1] = -100;
                }
            }
            particleGeo.attributes.position.needsUpdate = true;
            particleGeo.attributes.color.needsUpdate = true;
        }

        function resetBlock() {
            initSimulationData();
            simTexture.needsUpdate = true;
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            stepCombustion();
            updateParticles(dt);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
