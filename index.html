<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Dessert Arkanoid - Special Items</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2b170e;
            font-family: 'Arial Rounded MT Bold', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 12px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            pointer-events: none;
            z-index: 10;
        }
        .hud-text {
            color: #3d1c08;
            font-size: clamp(14px, 3.5vw, 20px);
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
            background: rgba(240, 220, 190, 0.85);
            padding: 6px 12px;
            border-radius: 16px;
            border: 2px solid #5a3118;
            box-shadow: 0 4px 8px rgba(0,0,0,0.35);
        }
        #buff-hud {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffe6cf;
            font-size: 15px;
            font-weight: bold;
            background: rgba(56, 30, 14, 0.9);
            padding: 5px 16px;
            border-radius: 12px;
            border: 2px solid #f0a354;
            display: none;
            z-index: 10;
            text-align: center;
        }
        #msg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 15, 8, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #msg-title {
            font-size: clamp(26px, 7vw, 42px);
            color: #ffd89b;
            text-shadow: 2px 3px 0 #a34e00;
            margin-bottom: 12px;
        }
        #msg-sub {
            font-size: clamp(14px, 4vw, 18px);
            color: #ffe6cf;
            margin-bottom: 26px;
            line-height: 1.5;
        }
        .cookie-btn {
            background: linear-gradient(145deg, #f0a354, #b8621d);
            border: 3px solid #6b3305;
            color: #381a03;
            font-size: clamp(18px, 4.5vw, 22px);
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 0 #4a2100, 0 8px 12px rgba(0,0,0,0.4);
            pointer-events: auto;
            transition: transform 0.1s;
        }
        .cookie-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #4a2100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div class="hud-text">SCORE: <span id="score-val">000000</span></div>
        <div class="hud-text">LIVES: <span id="lives-val">3</span></div>
    </div>
    <div id="buff-hud">특수 효과 발동 중!</div>

    <div id="msg-overlay">
        <div id="msg-title">SWEET ARKANOID 3D</div>
        <div id="msg-sub">블록을 깨고 떨어지는 사탕 아이템을 먹어<br>다양한 10초 특수 능력을 체험하세요!</div>
        <button class="cookie-btn" id="start-btn">TAP TO PLAY</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        const ARENA_WIDTH = 22;
        const ARENA_HEIGHT = 42;
        const WALL_THICK = 1.3;
        const WALL_HEIGHT = 1.6;

        let score = 0;
        let lives = 3;
        let isRunning = false;
        
        let scene, camera, renderer;
        let paddle;
        let balls = []; // 멀티볼 지원을 위해 배열로 관리
        let blocks = [];
        let destroyedBlocksHistory = []; // 핸디캡(블록 복원)용 파괴된 블록 기록
        let items = [];
        let particles = [];
        const BALL_SPEED = 28.5;

        // 버프 시스템 상태 관리
        let activeBuff = null;
        let buffTimer = 0;

        let shakeDuration = 0;
        let shakeIntensity = 0;

        const COLOR_PALETTE = [
            0xaf3a41, 0xd9824c, 0xf2b568, 
            0x60341e, 0x98572b, 0xedd087, 
            0x7c9b68, 0x53779e, 0xf7f4e9
        ];

        let matCookieCrust, matBiscuitBase, matBallNormal, matBallBlack, matFloor;

        function initMaterials() {
            matCookieCrust = new THREE.MeshStandardMaterial({ color: 0xdca263, roughness: 0.8, metalness: 0.05 });
            matBiscuitBase = new THREE.MeshStandardMaterial({ color: 0xe0ab75, roughness: 0.85, metalness: 0.0 });
            matBallNormal = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9, roughness: 0.15 });
            matBallBlack = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x330033, metalness: 1.0, roughness: 0.1 });
            matFloor = new THREE.MeshStandardMaterial({ color: 0xfffcf7, roughness: 0.9, metalness: 0.0 });
        }

        function fitCameraToBoard() {
            const aspect = window.innerWidth / window.innerHeight;
            const targetHeight = ARENA_HEIGHT + 4.5;
            const targetWidth = ARENA_WIDTH + WALL_THICK * 2 + 1.0;
            const fovRad = (camera.fov * Math.PI) / 180;
            const distV = (targetHeight / 2) / Math.tan(fovRad / 2);
            const distH = (targetWidth / 2) / (Math.tan(fovRad / 2) * aspect);
            const camDistance = Math.max(distV, distH) * 1.02;
            const tiltAngle = 0.28; 

            camera.position.set(0, camDistance * Math.cos(tiltAngle), camDistance * Math.sin(tiltAngle) * 0.45);
            camera.lookAt(0, 0, -1.0);
        }

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x381e13);

            camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
            fitCameraToBoard();

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            initMaterials();

            const ambLight = new THREE.AmbientLight(0xfff6ea, 0.8);
            scene.add(ambLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.3);
            dirLight.position.set(12, 35, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            buildBoard();
            buildPaddle();
            spawnBlocks();

            window.addEventListener('resize', onWindowResize);
            setupInput();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            fitCameraToBoard();
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function buildBoard() {
            const floorGeo = new THREE.BoxGeometry(ARENA_WIDTH, 0.4, ARENA_HEIGHT);
            const floorMesh = new THREE.Mesh(floorGeo, matFloor);
            floorMesh.position.y = -0.2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            const wallMat = matCookieCrust;
            const wallH = WALL_HEIGHT;
            const wallT = WALL_THICK;

            const topGeo = new THREE.BoxGeometry(ARENA_WIDTH + wallT * 2, wallH, wallT);
            const topWall = new THREE.Mesh(topGeo, wallMat);
            topWall.position.set(0, wallH / 2, -ARENA_HEIGHT / 2 - wallT / 2);
            scene.add(topWall);

            const sideGeo = new THREE.BoxGeometry(wallT, wallH, ARENA_HEIGHT);
            const leftWall = new THREE.Mesh(sideGeo, wallMat);
            leftWall.position.set(-ARENA_WIDTH / 2 - wallT / 2, wallH / 2, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(sideGeo, wallMat);
            rightWall.position.set(ARENA_WIDTH / 2 + wallT / 2, wallH / 2, 0);
            scene.add(rightWall);
        }

        function buildPaddle() {
            paddle = new THREE.Group();
            const pW = 5.6, pH = 0.9, pD = 1.5;

            const baseGeo = new THREE.BoxGeometry(pW, pH * 0.45, pD);
            const baseMesh = new THREE.Mesh(baseGeo, matBiscuitBase);
            baseMesh.position.y = pH * 0.225;
            paddle.add(baseMesh);

            const segCount = 6;
            const segW = (pW - 0.3) / segCount;
            for (let i = 0; i < segCount; i++) {
                const segGeo = new THREE.BoxGeometry(segW * 0.88, pH * 0.55, pD * 0.85);
                const segMat = new THREE.MeshStandardMaterial({ color: (i % 2 === 0) ? 0xf5ebd7 : 0x733f20, roughness: 0.35 });
                const segMesh = new THREE.Mesh(segGeo, segMat);
                segMesh.position.set(-pW / 2 + 0.15 + segW * (i + 0.5), pH * 0.7, 0);
                paddle.add(segMesh);
            }

            paddle.position.set(0, 0, ARENA_HEIGHT / 2 - 4.5);
            paddle.width = pW;
            paddle.depth = pD;
            scene.add(paddle);
        }

        function createBall(x, z, isBlack = false) {
            const radius = 0.65;
            const ballGeo = new THREE.SphereGeometry(radius, 32, 32);
            const mesh = new THREE.Mesh(ballGeo, isBlack ? matBallBlack : matBallNormal);
            mesh.castShadow = true;
            mesh.position.set(x, radius, z);
            scene.add(mesh);

            return {
                mesh: mesh,
                radius: radius,
                velocity: new THREE.Vector3(0, 0, 0),
                isAttached: true,
                isBlack: isBlack
            };
        }

        function resetBalls() {
            balls.forEach(b => scene.remove(b.mesh));
            balls = [];
            const mainBall = createBall(paddle.position.x, paddle.position.z - 1.2);
            balls.push(mainBall);
            activeBuff = null;
            document.getElementById('buff-hud').style.display = 'none';
        }

        function spawnBlocks() {
            blocks.forEach(b => scene.remove(b.group));
            blocks = [];
            destroyedBlocksHistory = [];

            const cols = 8, rows = 5;
            const bWidth = 2.3, bDepth = 1.7, bHeight = 0.85, gap = 0.25;
            const startX = -((cols * (bWidth + gap) - gap) / 2) + bWidth / 2;
            const startZ = -ARENA_HEIGHT / 2 + 3.8;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const blockGroup = new THREE.Group();
                    const baseGeo = new THREE.BoxGeometry(bWidth, bHeight * 0.45, bDepth);
                    const baseMesh = new THREE.Mesh(baseGeo, matBiscuitBase);
                    baseMesh.position.y = bHeight * 0.225;
                    blockGroup.add(baseMesh);

                    const chocColor = COLOR_PALETTE[(r * 2 + c) % COLOR_PALETTE.length];
                    const chocMat = new THREE.MeshStandardMaterial({ color: chocColor, roughness: 0.28 });
                    const topGeo = new THREE.BoxGeometry(bWidth * 0.86, bHeight * 0.55, bDepth * 0.86);
                    const topMesh = new THREE.Mesh(topGeo, chocMat);
                    topMesh.position.y = bHeight * 0.725;
                    blockGroup.add(topMesh);

                    const x = startX + c * (bWidth + gap);
                    const z = startZ + r * (bDepth + gap);
                    blockGroup.position.set(x, 0, z);
                    scene.add(blockGroup);

                    blocks.push({
                        group: blockGroup,
                        x: x, z: z,
                        halfW: bWidth / 2, halfD: bDepth / 2,
                        color: chocColor,
                        r: r, c: c
                    });
                }
            }
        }

        // 아이템 스폰 (랜덤 1~5번)
        function spawnItem(x, z) {
            const itemGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
            const itemType = Math.floor(Math.random() * 5) + 1; // 1 ~ 5
            const itemColors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff];
            const itemMat = new THREE.MeshStandardMaterial({ color: itemColors[itemType - 1], emissive: itemColors[itemType - 1], emissiveIntensity: 0.4 });
            const mesh = new THREE.Mesh(itemGeo, itemMat);
            mesh.position.set(x, 0.5, z);
            scene.add(mesh);

            items.push({ mesh: mesh, type: itemType, x: x, z: z });
        }

        function applyBuff(type) {
            activeBuff = type;
            buffTimer = 10.0; // 10초 유지
            const buffNames = [
                "", 
                "특수기능 1: 멀티볼 (공 3개)", 
                "특수기능 2: 자이언트 볼 (크기 2배)", 
                "특수기능 3: 블랙 홀리건 (무적 파괴)", 
                "특수기능 4: [핸디캡] 블록 재생 복원", 
                "특수기능 5: 패들 점착 (캐치)"
            ];
            
            const hud = document.getElementById('buff-hud');
            hud.innerText = buffNames[type];
            hud.style.display = 'block';

            if (type === 1) {
                // 멀티볼: 기존 공 위치에서 2개 추가 생성
                if (balls.length > 0) {
                    const refBall = balls[0];
                    for (let i = 0; i < 2; i++) {
                        const newBall = createBall(refBall.mesh.position.x, refBall.mesh.position.z);
                        newBall.isAttached = false;
                        const angle = (Math.random() - 0.5) * Math.PI * 0.5;
                        newBall.velocity.set(Math.sin(angle) * BALL_SPEED, 0, -Math.cos(angle) * BALL_SPEED);
                        balls.push(newBall);
                    }
                }
            } else if (type === 3) {
                // 무적 블랙 공으로 변경
                balls.forEach(b => {
                    b.isBlack = true;
                    b.mesh.material = matBallBlack;
                });
            }
        }

        let targetPaddleX = 0;
        const raycaster = new THREE.Raycaster();
        const touchPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const rayPos = new THREE.Vector3();

        function setupInput() {
            function handlePointer(e) {
                const ndcX = (e.clientX / window.innerWidth) * 2 - 1;
                const ndcY = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
                if (raycaster.ray.intersectPlane(touchPlane, rayPos)) {
                    const xLimit = ARENA_WIDTH / 2 - paddle.width / 2;
                    targetPaddleX = Math.max(-xLimit, Math.min(xLimit, rayPos.x));
                }

                // 점착(캐치) 상태이거나 시작 전이면 발사
                balls.forEach(b => {
                    if (b.isAttached && isRunning) {
                        b.isAttached = false;
                        const angle = (Math.random() * 0.4 - 0.2) * Math.PI;
                        b.velocity.set(Math.sin(angle) * BALL_SPEED, 0, -Math.cos(angle) * BALL_SPEED);
                    }
                });
            }

            window.addEventListener('pointerdown', handlePointer);
            window.addEventListener('pointermove', (e) => {
                if (e.buttons > 0 || e.pointerType === 'touch') handlePointer(e);
            });
        }

        function triggerScreenShake(duration, intensity) {
            shakeDuration = duration;
            shakeIntensity = intensity;
        }

        function updatePhysics(dt) {
            paddle.position.x += (targetPaddleX - paddle.position.x) * Math.min(1, 28 * dt);

            // 버프 타이머 처리
            if (activeBuff) {
                buffTimer -= dt;
                if (buffTimer <= 0) {
                    if (activeBuff === 3) {
                        balls.forEach(b => {
                            b.isBlack = false;
                            b.mesh.material = matBallNormal;
                        });
                    }
                    activeBuff = null;
                    document.getElementById('buff-hud').style.display = 'none';
                }
            }

            // 아이템 낙하 처리
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.mesh.position.z += 8 * dt;
                item.mesh.rotation.y += 3 * dt;

                // 패들과 충돌 체크
                if (item.mesh.position.z >= paddle.position.z - paddle.depth/2 &&
                    item.mesh.position.z <= paddle.position.z + paddle.depth/2 &&
                    item.mesh.position.x >= paddle.position.x - paddle.width/2 &&
                    item.mesh.position.x <= paddle.position.x + paddle.width/2) {
                    
                    applyBuff(item.type);
                    scene.remove(item.mesh);
                    items.splice(i, 1);
                    continue;
                }

                if (item.mesh.position.z > ARENA_HEIGHT / 2) {
                    scene.remove(item.mesh);
                    items.splice(i, 1);
                }
            }

            // 공 업데이트
            for (let i = balls.length - 1; i >= 0; i--) {
                const ball = balls[i];
                const currentRadius = (activeBuff === 2) ? ball.radius * 2 : ball.radius;
                ball.mesh.scale.set(activeBuff === 2 ? 2 : 1, activeBuff === 2 ? 2 : 1, activeBuff === 2 ? 2 : 1);

                if (ball.isAttached) {
                    ball.mesh.position.x = paddle.position.x;
                    ball.mesh.position.z = paddle.position.z - 1.2;
                    continue;
                }

                ball.mesh.position.x += ball.velocity.x * dt;
                ball.mesh.position.z += ball.velocity.z * dt;

                // 좌우 벽
                const xLimit = ARENA_WIDTH / 2 - currentRadius;
                if (ball.mesh.position.x <= -xLimit) {
                    ball.mesh.position.x = -xLimit;
                    ball.velocity.x *= -1;
                } else if (ball.mesh.position.x >= xLimit) {
                    ball.mesh.position.x = xLimit;
                    ball.velocity.x *= -1;
                }

                // 상단 벽
                const topLimit = -ARENA_HEIGHT / 2 + currentRadius;
                if (ball.mesh.position.z <= topLimit) {
                    ball.mesh.position.z = topLimit;
                    ball.velocity.z *= -1;
                }

                // 패들 충돌
                const padZ = paddle.position.z;
                const padHalfW = paddle.width / 2;
                const padHalfD = paddle.depth / 2;

                if (ball.mesh.position.z + currentRadius >= padZ - padHalfD &&
                    ball.mesh.position.z - currentRadius <= padZ + padHalfD &&
                    ball.mesh.position.x >= paddle.position.x - padHalfW - currentRadius &&
                    ball.mesh.position.x <= paddle.position.x + padHalfW + currentRadius &&
                    ball.velocity.z > 0) {

                    // 핸디캡(특수기능 4): 패들에 닿을 때마다 없어진 블록 1개 복원
                    if (activeBuff === 4 && destroyedBlocksHistory.length > 0) {
                        const restored = destroyedBlocksHistory.pop();
                        scene.add(restored.group);
                        blocks.push(restored);
                    }

                    // 특수기능 5: 캐치 (패들에 들러붙음)
                    if (activeBuff === 5) {
                        ball.isAttached = true;
                        continue;
                    }

                    ball.mesh.position.z = padZ - padHalfD - currentRadius;
                    const hitOffset = (ball.mesh.position.x - paddle.position.x) / padHalfW;
                    const bounceAngle = hitOffset * (Math.PI / 3.0);
                    const currentSpeed = ball.velocity.length();
                    ball.velocity.x = Math.sin(bounceAngle) * currentSpeed;
                    ball.velocity.z = -Math.cos(bounceAngle) * currentSpeed;

                    triggerScreenShake(0.12, 0.2);
                }

                // 블록 충돌
                for (let j = blocks.length - 1; j >= 0; j--) {
                    const b = blocks[j];
                    const dx = ball.mesh.position.x - b.x;
                    const dz = ball.mesh.position.z - b.z;
                    const overlapX = (b.halfW + currentRadius) - Math.abs(dx);
                    const overlapZ = (b.halfD + currentRadius) - Math.abs(dz);

                    if (overlapX > 0 && overlapZ > 0) {
                        // 블랙 홀리건(무적 공)이 아니면 반사 연산 수행
                        if (!ball.isBlack) {
                            if (overlapX < overlapZ) {
                                ball.velocity.x *= -1;
                                ball.mesh.position.x += (dx > 0 ? overlapX : -overlapX);
                            } else {
                                ball.velocity.z *= -1;
                                ball.mesh.position.z += (dz > 0 ? overlapZ : -overlapZ);
                            }
                        }

                        scene.remove(b.group);
                        blocks.splice(j, 1);
                        destroyedBlocksHistory.push(b); // 복원용 기록 보관

                        // 확률적으로 아이템 드롭 (30% 확률)
                        if (Math.random() < 0.3) {
                            spawnItem(b.x, b.z);
                        }

                        score += 150;
                        document.getElementById('score-val').innerText = score.toString().padStart(6, '0');
                        triggerScreenShake(0.1, 0.15);

                        if (blocks.length === 0) {
                            showGameOver("STAGE CLEARED!", "모든 비스킷 블록을 부수었습니다!");
                        }
                        break;
                    }
                }

                // 바닥 탈락
                if (ball.mesh.position.z > ARENA_HEIGHT / 2 + 1.5) {
                    scene.remove(ball.mesh);
                    balls.splice(i, 1);

                    if (balls.length === 0) {
                        lives--;
                        document.getElementById('lives-val').innerText = lives;
                        if (lives > 0) {
                            resetBalls();
                        } else {
                            showGameOver("GAME OVER", "다시 도전해보세요!");
                        }
                    }
                }
            }
        }

        function showGameOver(title, sub) {
            isRunning = false;
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-sub').innerHTML = sub;
            document.getElementById('start-btn').innerText = "PLAY AGAIN";
            document.getElementById('msg-overlay').style.display = "flex";
        }

        function startGame() {
            score = 0;
            lives = 3;
            document.getElementById('score-val').innerText = "000000";
            document.getElementById('lives-val').innerText = "3";
            document.getElementById('msg-overlay').style.display = "none";
            
            items.forEach(it => scene.remove(it.mesh));
            items = [];

            spawnBlocks();
            resetBalls();
            isRunning = true;
        }

        document.getElementById('start-btn').addEventListener('click', startGame);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.033);

            if (isRunning) {
                updatePhysics(dt);
            }

            if (shakeDuration > 0) {
                shakeDuration -= dt;
                camera.position.x += (Math.random() - 0.5) * shakeIntensity;
                camera.position.y += (Math.random() - 0.5) * shakeIntensity;
            } else {
                fitCameraToBoard();
            }

            renderer.render(scene, camera);
        }

        initScene();
        animate();
    </script>
</body>
</html>
