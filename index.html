<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>나무토막 연소 시뮬레이터</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050507;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .info-card {
            background: rgba(16, 16, 22, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f0f0f0;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7);
        }
        .btn-reset {
            pointer-events: auto;
            background: #252530;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-reset:active { background: #404050; }
        #status-pill {
            margin-top: 6px;
            font-weight: bold;
            color: #ffaa44;
        }

        #bottom-bar {
            position: absolute;
            bottom: 28px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }
        .btn-fire {
            pointer-events: auto;
            background: linear-gradient(135deg, #ff4500, #cc1100);
            border: 2px solid #ff7744;
            color: #ffffff;
            padding: 15px 45px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 6px 28px rgba(255, 69, 0, 0.65);
            cursor: pointer;
            transform: scale(1.0);
            transition: transform 0.15s ease;
        }
        .btn-fire:active {
            transform: scale(0.94);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <div class="info-card">
            <div>🪵 <b>화염 연소 시뮬레이터</b></div>
            <div>• 화면 드래그: 카메라 360도 회전</div>
            <div>• 나무 표면 터치: <b>발화 시작점 지정</b></div>
            <div>• FIRE 버튼: <b>불 붙이기 (즉시 확산)</b></div>
            <div id="status-pill">상태: 나무를 터치하거나 FIRE를 누르세요</div>
        </div>
        <button class="btn-reset" onclick="resetSimulation()">새 나무로 리셋</button>
    </div>

    <div id="bottom-bar">
        <button id="fire-btn" class="btn-fire" onclick="triggerIgnition()">🔥 FIRE (불 붙이기)</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const statusPill = document.getElementById('status-pill');
        const fireBtn = document.getElementById('fire-btn');

        // --- 1. 3D 씬 및 카메라 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060608);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.8, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 1.1;
        controls.maxDistance = 6.0;

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 0.6);
        dirLight.position.set(3, 5, 4);
        scene.add(dirLight);

        const firePointLight = new THREE.PointLight(0xff4500, 0, 6.0, 1.8);
        scene.add(firePointLight);

        const floorGeo = new THREE.PlaneGeometry(12, 12);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0e0e11, roughness: 0.95 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.55;
        scene.add(floor);

        // --- 2. 조준 링 커서 ---
        const cursorGeo = new THREE.RingGeometry(0.04, 0.07, 32);
        const cursorMat = new THREE.MeshBasicMaterial({
            color: 0xff3300,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.95,
            depthTest: false
        });
        const targetCursor = new THREE.Mesh(cursorGeo, cursorMat);
        targetCursor.visible = false;
        targetCursor.renderOrder = 999;
        scene.add(targetCursor);

        let selectedLocalPoint = null;

        // --- 3. 나무 모델 및 커스텀 셰이더 ---
        const woodGeo = new THREE.BoxGeometry(1.6, 0.5, 0.5, 40, 16, 16);
        const posAttr = woodGeo.attributes.position;
        const vertexCount = posAttr.count;

        // 버텍스 어트리뷰트 (x: 연소진행도 0~1, y: 현재 불꽃세기 0~1)
        const burnAttrData = new Float32Array(vertexCount * 3);
        const burnAttribute = new THREE.BufferAttribute(burnAttrData, 3);
        woodGeo.setAttribute('aBurn', burnAttribute);

        const woodMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                precision highp float;
                attribute vec3 aBurn; // x: progress (0:원목 ~ 1:재), y: flame (0~1)
                varying vec3 vBurn;
                varying vec3 vPosition;
                varying vec3 vNormal;

                void main() {
                    vBurn = aBurn;
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;

                    // 연소 진행에 따라 표면이 얇게 깎여나감 (최대 2.5cm)
                    vec3 displacedPos = position - normal * (aBurn.x * 0.025);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPos, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;
                varying vec3 vBurn;
                varying vec3 vPosition;
                varying vec3 vNormal;

                float hash(vec3 p) {
                    p = fract(p * 0.3183099 + 0.1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }
                float noise(vec3 x) {
                    vec3 i = floor(x);
                    vec3 f = fract(x);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                                   mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                               mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                                   mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
                }

                void main() {
                    float progress = vBurn.x; // 0 (원목) -> 1 (완전소진)
                    float flame = vBurn.y;    // 활성 화염 세기

                    // 1. 나뭇결 알베도
                    float grain = noise(vPosition * vec3(2.5, 18.0, 18.0));
                    vec3 woodLight = vec3(0.55, 0.36, 0.20);
                    vec3 woodDark  = vec3(0.28, 0.16, 0.08);
                    vec3 woodCol = mix(woodDark, woodLight, grain);

                    // 2. 검은 숯 변색
                    float crack = noise(vPosition * 35.0);
                    vec3 charCol = vec3(0.04, 0.04, 0.04);
                    vec3 surfaceCol = mix(woodCol, charCol, smoothstep(0.05, 0.45, progress));

                    // 3. 붉은 잉걸불(Glow) - 숯 틈새에서 이글거리는 불씨
                    float emberIntensity = smoothstep(0.1, 0.75, progress) * (1.0 - smoothstep(0.7, 0.98, progress));
                    vec3 emberCol = vec3(3.2, 0.4, 0.02) * emberIntensity * (crack * 0.6 + 0.5);

                    // 4. 활활 타오르는 화염 림 (Wavefront)
                    vec3 activeFlameCol = vec3(4.5, 1.4, 0.1) * pow(flame, 1.4);

                    vec3 lightDir = normalize(vec3(1.0, 2.0, 1.5));
                    float diff = max(dot(vNormal, lightDir), 0.2);

                    gl_FragColor = vec4(surfaceCol * diff + emberCol + activeFlameCol, 1.0);
                }
            `
        });

        const woodBlock = new THREE.Mesh(woodGeo, woodMaterial);
        scene.add(woodBlock);

        // --- 4. 화염 & 불티 파티클 시스템 ---
        const PARTICLE_COUNT = 900;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(PARTICLE_COUNT * 3);
        const pCol = new Float32Array(PARTICLE_COUNT * 3);
        const pLife = new Float32Array(PARTICLE_COUNT);
        const pMaxLife = new Float32Array(PARTICLE_COUNT);
        const pVel = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            pPos[i * 3 + 1] = -100;
            pLife[i] = 1.0;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));

        const pMat = new THREE.PointsMaterial({
            size: 0.18,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const fireParticles = new THREE.Points(pGeo, pMat);
        scene.add(fireParticles);

        // --- 5. 모바일 친화적 터치 조준 로직 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let touchStartX = 0, touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) {
                const deltaX = Math.abs(e.changedTouches[0].clientX - touchStartX);
                const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);
                // 모바일 터치 흔들림 허용치를 30px로 대폭 완화
                if (deltaX < 30 && deltaY < 30) {
                    checkRaycastHit(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                }
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            const deltaX = Math.abs(e.clientX - touchStartX);
            const deltaY = Math.abs(e.clientY - touchStartY);
            if (deltaX < 15 && deltaY < 15) {
                checkRaycastHit(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mousedown', (e) => {
            touchStartX = e.clientX;
            touchStartY = e.clientY;
        });

        function checkRaycastHit(screenX, screenY) {
            mouse.x = (screenX / window.innerWidth) * 2 - 1;
            mouse.y = -(screenY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObject(woodBlock);
            if (intersects.length > 0) {
                const hit = intersects[0];
                selectedLocalPoint = woodBlock.worldToLocal(hit.point.clone());

                targetCursor.position.copy(hit.point).add(hit.face.normal.clone().multiplyScalar(0.005));
                targetCursor.lookAt(hit.point.clone().add(hit.face.normal));
                targetCursor.visible = true;

                statusPill.innerText = "조준 완료! FIRE 버튼을 누르세요 🎯";
                statusPill.style.color = "#00ffaa";
            }
        }

        // --- 6. 화염 파면(Wavefront) 물리 시뮬레이션 상태 ---
        let isSimulating = false;
        let simTime = 0;
        let ignitionPoint = new THREE.Vector3(0, 0.25, 0); // 기본값: 윗면 중앙

        const SPREAD_SPEED = 0.08;   // 초당 8cm씩 동심원으로 확산 (전체 20초에 걸쳐 번짐)
        const ACTIVE_FLAME_TIME = 6.0; // 한 지점에서 맹렬한 불꽃이 타오르는 시간 (초)
        const EMBER_TIME = 8.0;      // 잉걸불로 식어가는 시간 (초)

        function triggerIgnition() {
            // 터치 조준을 안 했더라도 나무 상단 중앙을 기본 발화점으로 자동 설정 (절대 실패 안 함)
            if (selectedLocalPoint) {
                ignitionPoint.copy(selectedLocalPoint);
            } else {
                ignitionPoint.set(0, 0.25, 0);
            }

            isSimulating = true;
            simTime = 0;
            targetCursor.visible = false;
            statusPill.innerText = "상태: 불이 붙어 사방으로 번져나가는 중! 🔥";
            statusPill.style.color = "#ff3300";
        }

        function resetSimulation() {
            isSimulating = false;
            simTime = 0;
            selectedLocalPoint = null;
            targetCursor.visible = false;
            firePointLight.intensity = 0;

            for (let i = 0; i < vertexCount * 3; i++) {
                burnAttrData[i] = 0;
            }
            burnAttribute.needsUpdate = true;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                pPos[i * 3 + 1] = -100;
                pLife[i] = 1.0;
            }
            pGeo.attributes.position.needsUpdate = true;

            statusPill.innerText = "상태: 나무를 터치하거나 FIRE를 누르세요";
            statusPill.style.color = "#ffaa44";
        }

        // --- 7. 메인 연소 업데이트 함수 ---
        function updateCombustion(dt) {
            if (!isSimulating) return;

            simTime += dt;
            const currentWaveRadius = simTime * SPREAD_SPEED;

            let activeFlames = 0;
            let burningVertices = [];
            let allBurntOut = true;

            for (let i = 0; i < vertexCount; i++) {
                const vx = posAttr.getX(i);
                const vy = posAttr.getY(i);
                const vz = posAttr.getZ(i);

                const dx = vx - ignitionPoint.x;
                const dy = vy - ignitionPoint.y;
                const dz = vz - ignitionPoint.z;
                const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                // 화염 파면 도달 시간 계산
                const reachTime = dist / SPREAD_SPEED;

                if (simTime >= reachTime) {
                    // 불이 이미 도달한 정점
                    const elapsed = simTime - reachTime; // 이 지점에 불이 붙은 후 흐른 시간
                    const totalLife = ACTIVE_FLAME_TIME + EMBER_TIME;

                    const progress = Math.min(1.0, elapsed / totalLife);

                    // 화염 세기: 불이 막 붙었을 때(0 ~ ACTIVE_FLAME_TIME) 최대
                    let flame = 0;
                    if (elapsed < ACTIVE_FLAME_TIME) {
                        flame = Math.sin((elapsed / ACTIVE_FLAME_TIME) * Math.PI);
                        activeFlames++;
                        burningVertices.push(i);
                    }

                    if (progress < 1.0) {
                        allBurntOut = false;
                    }

                    burnAttrData[i * 3]     = progress;
                    burnAttrData[i * 3 + 1] = flame;
                } else {
                    // 아직 불이 안 닿은 생나무
                    allBurntOut = false;
                    burnAttrData[i * 3]     = 0.0;
                    burnAttrData[i * 3 + 1] = 0.0;
                }
            }

            burnAttribute.needsUpdate = true;

            // 광원 및 파티클 방출 연동
            if (activeFlames > 0) {
                let cx = 0, cy = 0, cz = 0;
                for (let k = 0; k < burningVertices.length; k++) {
                    const idx = burningVertices[k];
                    cx += posAttr.getX(idx);
                    cy += posAttr.getY(idx);
                    cz += posAttr.getZ(idx);
                }
                const count = burningVertices.length;
                const localCenter = new THREE.Vector3(cx / count, cy / count + 0.15, cz / count);
                const worldCenter = woodBlock.localToWorld(localCenter);

                firePointLight.intensity = THREE.MathUtils.lerp(firePointLight.intensity, Math.min(count * 0.05, 5.0), 0.15);
                firePointLight.position.copy(worldCenter);

                spawnFireParticles(burningVertices, count);
            } else {
                firePointLight.intensity = THREE.MathUtils.lerp(firePointLight.intensity, 0, 0.05);

                if (allBurntOut && simTime > 5.0) {
                    isSimulating = false;
                    statusPill.innerText = "상태: 나무가 완전히 타서 불이 꺼졌습니다 💨 (전소 완료)";
                    statusPill.style.color = "#888899";
                }
            }
        }

        function spawnFireParticles(burningIndices, fireStrength) {
            const count = Math.min(Math.floor(fireStrength * 0.4) + 2, 16);
            for (let k = 0; k < count; k++) {
                const randVIdx = burningIndices[Math.floor(Math.random() * burningIndices.length)];
                const localPos = new THREE.Vector3(posAttr.getX(randVIdx), posAttr.getY(randVIdx), posAttr.getZ(randVIdx));
                const worldPos = woodBlock.localToWorld(localPos);

                const pIdx = Math.floor(Math.random() * PARTICLE_COUNT);
                if (pLife[pIdx] >= 1.0) {
                    pLife[pIdx] = 0.0;
                    pMaxLife[pIdx] = 0.55 + Math.random() * 0.45;

                    pPos[pIdx * 3]     = worldPos.x + (Math.random() - 0.5) * 0.08;
                    pPos[pIdx * 3 + 1] = worldPos.y + 0.02;
                    pPos[pIdx * 3 + 2] = worldPos.z + (Math.random() - 0.5) * 0.08;

                    pVel[pIdx * 3]     = (Math.random() - 0.5) * 0.22;
                    pVel[pIdx * 3 + 1] = 0.9 + Math.random() * 0.8;
                    pVel[pIdx * 3 + 2] = (Math.random() - 0.5) * 0.22;
                }
            }
        }

        function updateParticles(dt) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (pLife[i] < 1.0) {
                    pLife[i] += dt / pMaxLife[i];
                    pPos[i * 3]     += pVel[i * 3] * dt;
                    pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
                    pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;

                    const l = pLife[i];
                    if (l < 0.25) {
                        pCol[i * 3] = 1.0; pCol[i * 3 + 1] = 0.95; pCol[i * 3 + 2] = 0.3;
                    } else if (l < 0.65) {
                        pCol[i * 3] = 0.98; pCol[i * 3 + 1] = 0.38; pCol[i * 3 + 2] = 0.02;
                    } else {
                        pCol[i * 3] = 0.15; pCol[i * 3 + 1] = 0.15; pCol[i * 3 + 2] = 0.15;
                    }
                } else {
                    pPos[i * 3 + 1] = -100;
                }
            }
            pGeo.attributes.position.needsUpdate = true;
            pGeo.attributes.color.needsUpdate = true;
        }

        let cursorTime = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            if (targetCursor.visible) {
                cursorTime += dt * 6.0;
                const scale = 1.0 + Math.sin(cursorTime) * 0.12;
                targetCursor.scale.set(scale, scale, 1.0);
            }

            updateCombustion(dt);
            updateParticles(dt);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
