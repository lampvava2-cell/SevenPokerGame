<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>나무토막 연소 시뮬레이터</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #060608;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .info-card {
            background: rgba(15, 15, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f0f0f0;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        .btn-reset {
            pointer-events: auto;
            background: #252530;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-reset:active { background: #404050; }
        #status-pill {
            margin-top: 5px;
            font-weight: bold;
            color: #ffaa44;
        }

        #bottom-bar {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }
        .btn-fire {
            pointer-events: auto;
            background: #2a2a30;
            border: 2px solid #444;
            color: #777;
            padding: 14px 44px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            transition: all 0.25s ease;
            cursor: not-allowed;
        }
        .btn-fire.ready {
            background: linear-gradient(135deg, #ff4500, #cc1100);
            border-color: #ff7744;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 6px 28px rgba(255, 69, 0, 0.7);
            transform: scale(1.05);
        }
        .btn-fire.ready:active {
            transform: scale(0.96);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <div class="info-card">
            <div>🪵 <b>화염 파면 전파 시뮬레이터</b></div>
            <div>• 화면 드래그: 카메라 360도 회전</div>
            <div>• 표면 터치: <b>점화 시작점 지정</b></div>
            <div>• FIRE 버튼: <b>화염 연쇄 확산 시작</b></div>
            <div id="status-pill">상태: 점화 위치를 선택하세요</div>
        </div>
        <button class="btn-reset" onclick="resetBlock()">새 나무로 리셋</button>
    </div>

    <div id="bottom-bar">
        <button id="fire-btn" class="btn-fire" onclick="triggerIgnition()">🔥 FIRE (불 붙이기)</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const statusPill = document.getElementById('status-pill');
        const fireBtn = document.getElementById('fire-btn');

        // --- 1. 3D 씬 및 카메라 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060609);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.8, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 1.2;
        controls.maxDistance = 6.0;

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 0.65);
        dirLight.position.set(3, 5, 4);
        scene.add(dirLight);

        const firePointLight = new THREE.PointLight(0xff4500, 0, 6.0, 1.8);
        scene.add(firePointLight);

        const floorGeo = new THREE.PlaneGeometry(12, 12);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f0f12, roughness: 0.95 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.55;
        scene.add(floor);

        // --- 2. 조준 링 커서 ---
        const cursorGeo = new THREE.RingGeometry(0.04, 0.065, 32);
        const cursorMat = new THREE.MeshBasicMaterial({
            color: 0xff3300,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.9,
            depthTest: false
        });
        const targetCursor = new THREE.Mesh(cursorGeo, cursorMat);
        targetCursor.visible = false;
        targetCursor.renderOrder = 999;
        scene.add(targetCursor);

        let selectedLocalPoint = null;

        // --- 3. 3D 정점 및 화염 파면(Wavefront) 엔진 구조 ---
        const woodGeo = new THREE.BoxGeometry(1.6, 0.5, 0.5, 32, 14, 14);
        const posAttr = woodGeo.attributes.position;
        const vertexCount = posAttr.count;

        // 정점 연소 상태
        // state: 0(미연소 원목) -> 1(맹렬히 타오르는 화염) -> 2(숯/잉걸불) -> 3(완전 전소 재)
        const burnProgress = new Float32Array(vertexCount); // 0.0(원목) ~ 1.0(완전소진)
        const fireIntensity = new Float32Array(vertexCount); // 현재 불꽃 세기
        const isIgnited = new Uint8Array(vertexCount);      // 불이 옮겨붙었는지 여부

        const burnAttrData = new Float32Array(vertexCount * 3); // x: burnProgress, y: fireIntensity, z: unused
        const burnAttribute = new THREE.BufferAttribute(burnAttrData, 3);
        woodGeo.setAttribute('aBurn', burnAttribute);

        let isSimulationRunning = false;

        function initSimulation() {
            for (let i = 0; i < vertexCount; i++) {
                burnProgress[i] = 0.0;
                fireIntensity[i] = 0.0;
                isIgnited[i] = 0;
                burnAttrData[i * 3]     = 0.0;
                burnAttrData[i * 3 + 1] = 0.0;
                burnAttrData[i * 3 + 2] = 0.0;
            }
            burnAttribute.needsUpdate = true;
            firePointLight.intensity = 0;
            selectedLocalPoint = null;
            isSimulationRunning = false;
            targetCursor.visible = false;
            fireBtn.className = 'btn-fire';
            statusPill.innerText = "상태: 점화 위치를 선택하세요";
            statusPill.style.color = "#ffaa44";
        }
        initSimulation();

        // --- 4. 셰이더 (표면 탄화, 활활 타는 화염 림, 잉걸불) ---
        const woodMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                attribute vec3 aBurn; // x: burnProgress (0~1), y: fireIntensity (0~1)
                varying vec3 vBurn;
                varying vec3 vPosition;
                varying vec3 vNormal;

                void main() {
                    vBurn = aBurn;
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;

                    // 연소 진행도에 따른 겉표면 미세 삭마 (최대 2.5cm 깎임)
                    vec3 displacedPos = position - normal * (aBurn.x * 0.025);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vBurn;
                varying vec3 vPosition;
                varying vec3 vNormal;

                float hash(vec3 p) {
                    p = fract(p * 0.3183099 + 0.1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }
                float noise(vec3 x) {
                    vec3 i = floor(x);
                    vec3 f = fract(x);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                                   mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                               mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                                   mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
                }

                void main() {
                    float progress = vBurn.x;  // 0(나무) -> 1(재)
                    float flame = vBurn.y;     // 0~1 (현재 타오르는 불길)

                    // 1. 기본 원목 나뭇결
                    float grain = noise(vPosition * vec3(3.0, 18.0, 18.0));
                    vec3 woodLight = vec3(0.55, 0.36, 0.20);
                    vec3 woodDark  = vec3(0.28, 0.16, 0.08);
                    vec3 woodCol = mix(woodDark, woodLight, grain);

                    // 2. 검은 숯(Charcoal) 변색
                    float crack = noise(vPosition * 40.0);
                    vec3 charCol = vec3(0.03, 0.03, 0.03);
                    vec3 surfaceCol = mix(woodCol, charCol, smoothstep(0.05, 0.55, progress));

                    // 3. 잉걸불(Glow): 불길이 지나간 뒤 속에서 이글거리는 숯불
                    float emberIntensity = smoothstep(0.1, 0.8, progress) * (1.0 - smoothstep(0.7, 1.0, progress));
                    vec3 emberCol = vec3(3.2, 0.4, 0.02) * emberIntensity * (crack * 0.6 + 0.5);

                    // 4. 화염 선두(Flame Wave): 막 불이 번져 타오르는 백색/주황색 화염 림
                    vec3 activeFlameCol = vec3(4.8, 1.2, 0.1) * pow(flame, 1.5);

                    // 기본 디렉셔널 라이트
                    vec3 lightDir = normalize(vec3(1.0, 2.0, 1.5));
                    float diff = max(dot(vNormal, lightDir), 0.18);

                    gl_FragColor = vec4(surfaceCol * diff + emberCol + activeFlameCol, 1.0);
                }
            `
        });

        const woodBlock = new THREE.Mesh(woodGeo, woodMaterial);
        scene.add(woodBlock);

        // --- 5. 대량 화염 및 불티 파티클 시스템 ---
        const PARTICLE_COUNT = 900;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(PARTICLE_COUNT * 3);
        const pCol = new Float32Array(PARTICLE_COUNT * 3);
        const pLife = new Float32Array(PARTICLE_COUNT);
        const pMaxLife = new Float32Array(PARTICLE_COUNT);
        const pVel = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            pPos[i * 3 + 1] = -100;
            pLife[i] = 1.0;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));

        const pMat = new THREE.PointsMaterial({
            size: 0.18,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const fireParticles = new THREE.Points(pGeo, pMat);
        scene.add(fireParticles);

        // --- 6. 터치 조준 및 점화 처리 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let touchStartX = 0, touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) {
                const deltaX = Math.abs(e.changedTouches[0].clientX - touchStartX);
                const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);
                if (deltaX < 12 && deltaY < 12) {
                    mouse.x = (e.changedTouches[0].clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.changedTouches[0].clientY / window.innerHeight) * 2 + 1;
                    selectTargetPoint();
                }
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            selectTargetPoint();
        });

        function selectTargetPoint() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(woodBlock);
            if (intersects.length > 0) {
                const hit = intersects[0];
                selectedLocalPoint = woodBlock.worldToLocal(hit.point.clone());

                targetCursor.position.copy(hit.point).add(hit.face.normal.clone().multiplyScalar(0.005));
                targetCursor.lookAt(hit.point.clone().add(hit.face.normal));
                targetCursor.visible = true;

                fireBtn.className = 'btn-fire ready';
                statusPill.innerText = "조준 완료! FIRE를 누르면 화염이 번져나갑니다 🎯";
                statusPill.style.color = "#00ffaa";
            }
        }

        // FIRE 버튼 클릭: 단 한 번의 점화로 전파 시작
        function triggerIgnition() {
            if (!selectedLocalPoint) return;

            const START_RADIUS = 0.18;
            const START_RADIUS_SQ = START_RADIUS * START_RADIUS;

            for (let i = 0; i < vertexCount; i++) {
                const dx = posAttr.getX(i) - selectedLocalPoint.x;
                const dy = posAttr.getY(i) - selectedLocalPoint.y;
                const dz = posAttr.getZ(i) - selectedLocalPoint.z;
                if (dx * dx + dy * dy + dz * dz <= START_RADIUS_SQ) {
                    isIgnited[i] = 1; // 점화 확정
                    fireIntensity[i] = 1.0;
                }
            }

            isSimulationRunning = true;
            statusPill.innerText = "상태: 불길이 장작 전체로 번져나가는 중! 🔥";
            statusPill.style.color = "#ff3300";

            targetCursor.visible = false;
            selectedLocalPoint = null;
            fireBtn.className = 'btn-fire';
        }

        // --- 7. 화염 파면 전파 (Wave Propagation) 물리 엔진 ---
        const SPREAD_SPEED = 0.16;   // 초당 불길이 번져나가는 반경 (m/s)
        const BURN_DURATION = 12.0;  // 한 지점이 불타고 숯이 되어 완전히 꺼질 때까지의 시간 (초)

        function stepWaveCombustion(dt) {
            if (!isSimulationRunning) return;

            let activeFlameCount = 0;
            let burningVertices = [];
            let newlyIgnited = [];

            // 1. 이미 불이 붙어 활활 타오르는 정점들로부터 인접 미연소 정점으로 화염 전파
            const spreadDist = SPREAD_SPEED * dt;
            const spreadDistSq = spreadDist * spreadDist * 1.5;

            for (let i = 0; i < vertexCount; i++) {
                // 현재 불길이 살아있는 정점만 불을 전파함
                if (isIgnited[i] === 1 && fireIntensity[i] > 0.15) {
                    const xi = posAttr.getX(i), yi = posAttr.getY(i), zi = posAttr.getZ(i);

                    for (let j = 0; j < vertexCount; j++) {
                        if (isIgnited[j] === 0) {
                            const dx = xi - posAttr.getX(j);
                            const dy = yi - posAttr.getY(j);
                            const dz = zi - posAttr.getZ(j);
                            // 전파 거리 내에 도달하면 즉시 발화 전선에 편입
                            if (dx * dx + dy * dy + dz * dz <= spreadDistSq) {
                                newlyIgnited.push(j);
                            }
                        }
                    }
                }
            }

            // 신규 발화 정점 적용
            for (let k = 0; k < newlyIgnited.length; k++) {
                const idx = newlyIgnited[k];
                if (isIgnited[idx] === 0) {
                    isIgnited[idx] = 1;
                    fireIntensity[idx] = 1.0;
                }
            }

            // 2. 발화된 정점들의 연소 생애주기 업데이트
            for (let i = 0; i < vertexCount; i++) {
                if (isIgnited[i] === 1) {
                    // 연소 진행도 증가
                    burnProgress[i] = Math.min(1.0, burnProgress[i] + (dt / BURN_DURATION));

                    // 화염 세기: 초반에 맹렬히 타오르다가(0.0~0.4), 숯이 되며 줄어듦(0.4~1.0)
                    if (burnProgress[i] < 0.35) {
                        fireIntensity[i] = 1.0;
                    } else {
                        fireIntensity[i] = Math.max(0.0, (1.0 - burnProgress[i]) / 0.65);
                    }

                    if (fireIntensity[i] > 0.05) {
                        activeFlameCount++;
                        burningVertices.push(i);
                    }

                    burnAttrData[i * 3]     = burnProgress[i];
                    burnAttrData[i * 3 + 1] = fireIntensity[i];
                }
            }

            burnAttribute.needsUpdate = true;

            // 3. 동적 조명 및 파티클 연동
            if (activeFlameCount > 0) {
                let cx = 0, cy = 0, cz = 0;
                for (let k = 0; k < burningVertices.length; k++) {
                    const vIdx = burningVertices[k];
                    cx += posAttr.getX(vIdx);
                    cy += posAttr.getY(vIdx);
                    cz += posAttr.getZ(vIdx);
                }
                const localCenter = new THREE.Vector3(cx / activeFlameCount, cy / activeFlameCount + 0.18, cz / activeFlameCount);
                const worldCenter = woodBlock.localToWorld(localCenter);

                firePointLight.intensity = THREE.MathUtils.lerp(firePointLight.intensity, Math.min(activeFlameCount * 0.08, 5.0), 0.15);
                firePointLight.position.copy(worldCenter);

                spawnParticlesAtBurnPoints(burningVertices, activeFlameCount);
            } else {
                firePointLight.intensity = THREE.MathUtils.lerp(firePointLight.intensity, 0, 0.05);

                // 장작 전체 연소 완료 판정
                if (isSimulationRunning) {
                    isSimulationRunning = false;
                    statusPill.innerText = "상태: 나무가 완전히 타서 불이 꺼졌습니다 💨 (전소 완료)";
                    statusPill.style.color = "#888899";
                }
            }
        }

        // 불꽃 및 불티 파티클 방출
        function spawnParticlesAtBurnPoints(burningIndices, fireStrength) {
            const count = Math.min(Math.floor(fireStrength * 0.5) + 3, 16);
            for (let k = 0; k < count; k++) {
                const randVIdx = burningIndices[Math.floor(Math.random() * burningIndices.length)];
                const localPos = new THREE.Vector3(posAttr.getX(randVIdx), posAttr.getY(randVIdx), posAttr.getZ(randVIdx));
                const worldPos = woodBlock.localToWorld(localPos);

                const pIdx = Math.floor(Math.random() * PARTICLE_COUNT);
                if (pLife[pIdx] >= 1.0) {
                    pLife[pIdx] = 0.0;
                    pMaxLife[pIdx] = 0.55 + Math.random() * 0.45;

                    pPos[pIdx * 3]     = worldPos.x + (Math.random() - 0.5) * 0.08;
                    pPos[pIdx * 3 + 1] = worldPos.y + 0.02;
                    pPos[pIdx * 3 + 2] = worldPos.z + (Math.random() - 0.5) * 0.08;

                    pVel[pIdx * 3]     = (Math.random() - 0.5) * 0.25;
                    pVel[pIdx * 3 + 1] = 1.0 + Math.random() * 0.8;
                    pVel[pIdx * 3 + 2] = (Math.random() - 0.5) * 0.25;
                }
            }
        }

        function updateParticles(dt) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (pLife[i] < 1.0) {
                    pLife[i] += dt / pMaxLife[i];
                    pPos[i * 3]     += pVel[i * 3] * dt;
                    pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
                    pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;

                    const l = pLife[i];
                    if (l < 0.25) {
                        pCol[i * 3] = 1.0; pCol[i * 3 + 1] = 0.95; pCol[i * 3 + 2] = 0.3; // 화이트-옐로우 코어
                    } else if (l < 0.65) {
                        pCol[i * 3] = 0.98; pCol[i * 3 + 1] = 0.4; pCol[i * 3 + 2] = 0.02; // 선명한 주황-적색
                    } else {
                        pCol[i * 3] = 0.15; pCol[i * 3 + 1] = 0.15; pCol[i * 3 + 2] = 0.15; // 연기 및 잿가루
                    }
                } else {
                    pPos[i * 3 + 1] = -100;
                }
            }
            pGeo.attributes.position.needsUpdate = true;
            pGeo.attributes.color.needsUpdate = true;
        }

        function resetBlock() {
            initSimulation();
        }

        let cursorTime = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            if (targetCursor.visible) {
                cursorTime += dt * 6.0;
                const scale = 1.0 + Math.sin(cursorTime) * 0.12;
                targetCursor.scale.set(scale, scale, 1.0);
            }

            stepWaveCombustion(dt);
            updateParticles(dt);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
