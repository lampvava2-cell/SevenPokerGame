<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>P2P 모닥불 시뮬레이션</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; overflow: hidden; background: #050508; font-family: sans-serif; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    /* 상단 멀티 세션 UI */
    #network-ui {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; gap: 8px; flex-wrap: wrap; z-index: 10;
      background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 8px; color: #fff; font-size: 13px;
    }
    #network-ui input { padding: 6px 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; flex: 1; min-width: 120px; }
    #network-ui button { padding: 6px 12px; border: none; border-radius: 4px; background: #e65100; color: #fff; font-weight: bold; cursor: pointer; }
    #status { width: 100%; color: #aaa; font-size: 12px; }

    /* 하단 조작 패널 */
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10; width: 90%; max-width: 400px;
    }
    .wood-btn {
      flex: 1; padding: 14px 8px; border: none; border-radius: 12px;
      font-size: 14px; font-weight: bold; color: #fff; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn-dry { background: linear-gradient(135deg, #d84315, #bf360c); }
    .btn-heavy { background: linear-gradient(135deg, #4e342e, #3e2723); }
    .btn-wet { background: linear-gradient(135deg, #37474f, #263238); }
    
    /* 화력 게이지 */
    #fire-meter {
      position: absolute; top: 80px; left: 12px; z-index: 10;
      color: #ff9800; font-weight: bold; font-size: 14px; text-shadow: 0 0 5px #000;
    }
  </style>

  <!-- 외부 서버 없이 브라우저 단독 실행을 위한 CDN 로드 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="network-ui">
    <button id="btn-host">방 만들기 (호스트)</button>
    <input type="text" id="room-input" placeholder="호스트 ID 입력">
    <button id="btn-join">접속</button>
    <div id="status">상태: 싱글 플레이 중 (1/3명)</div>
  </div>

  <div id="fire-meter">화력: 100%</div>

  <div id="controls">
    <button class="wood-btn btn-dry" onclick="spawnLog('dry')">마른 장작<br><small>화력 급상승</small></button>
    <button class="wood-btn btn-heavy" onclick="spawnLog('heavy')">참나무<br><small>오래 지속</small></button>
    <button class="wood-btn btn-wet" onclick="spawnLog('wet')">젖은 장작<br><small>연기 발생</small></button>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

    // ─── 1. Three.js 렌더러 및 씬 구성 ───
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.08);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 3.2, 4.5);
    camera.lookAt(0, 0.4, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 갤럭시 성능 최적화
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 조명 (화로 PointLight + 앰비언트)
    const ambientLight = new THREE.AmbientLight(0x221111, 0.8);
    scene.add(ambientLight);

    const fireLight = new THREE.PointLight(0xff6600, 2.5, 12, 1.5);
    fireLight.position.set(0, 0.5, 0);
    fireLight.castShadow = true;
    scene.add(fireLight);

    // 바닥 돌판
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 화로 돌 테두리
    const ringRadius = 1.0;
    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;
      const stone = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.25),
        new THREE.MeshStandardMaterial({ color: 0x333338, roughness: 0.8 })
      );
      stone.position.set(Math.cos(angle) * ringRadius, 0.1, Math.sin(angle) * ringRadius);
      scene.add(stone);
    }

    // ─── 2. CANNON-es 3D 물리 엔진 ───
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    // ─── 3. 모닥불 & 장작 시뮬레이션 로직 ───
    let logs = [];
    let fireIntensity = 20.0; // 기본 불씨

    class Wood {
      constructor(type, x, y, z, rotX, rotY, rotZ) {
        this.type = type;
        this.fuel = type === 'heavy' ? 80 : (type === 'dry' ? 30 : 50);
        this.maxFuel = this.fuel;
        this.isWet = type === 'wet';

        // 크기 및 무게 정의
        const radius = type === 'heavy' ? 0.14 : 0.09;
        const height = type === 'heavy' ? 0.9 : 0.7;

        // 물리 바디 (실린더 형태를 박스로 근사하여 모바일 연산 최적화)
        this.body = new CANNON.Body({
          mass: type === 'heavy' ? 3.0 : 1.2,
          shape: new CANNON.Box(new CANNON.Vec3(radius, height / 2, radius))
        });
        this.body.position.set(x, y, z);
        this.body.quaternion.setFromEuler(rotX, rotY, rotZ);
        world.addBody(this.body);

        // Three.js 메쉬
        const logGeo = new THREE.CylinderGeometry(radius, radius, height, 8);
        const logMat = new THREE.MeshStandardMaterial({
          color: type === 'dry' ? 0x8d6e63 : (type === 'heavy' ? 0x4e342e : 0x37474f),
          roughness: 0.8
        });
        this.mesh = new THREE.Mesh(logGeo, logMat);
        this.mesh.castShadow = true;
        scene.add(this.mesh);
      }

      update(delta) {
        // 물리 좌표 동기화
        this.mesh.position.copy(this.body.position);
        this.mesh.quaternion.copy(this.body.quaternion);

        // 화로 중심과의 거리 기반 연소
        const dist = Math.hypot(this.body.position.x, this.body.position.z);
        if (dist < 1.0 && fireIntensity > 2.0 && this.fuel > 0) {
          const burnRate = (this.isWet ? 0.4 : 1.2) * delta;
          this.fuel -= burnRate;

          // 재로 변하면서 메쉬 색상 변화
          const ratio = Math.max(0, this.fuel / this.maxFuel);
          this.mesh.material.color.setRGB(ratio * 0.5 + 0.1, ratio * 0.2 + 0.05, ratio * 0.1);

          // 화력 기여도
          if (!this.isWet) {
            fireIntensity = Math.min(100, fireIntensity + (this.type === 'dry' ? 4.0 : 1.5) * delta);
          } else {
            fireIntensity = Math.max(1.0, fireIntensity - 1.5 * delta); // 젖은 장작은 불을 낮춤
          }
        }
      }

      destroy() {
        world.removeBody(this.body);
        scene.remove(this.mesh);
      }
    }

    // 장작 투척 함수
    window.spawnLog = function(type, networkData = null) {
      let x, y, z, rx, ry, rz;
      if (networkData) {
        ({ x, y, z, rx, ry, rz } = networkData);
      } else {
        // 플레이어가 직접 던질 때의 랜덤 궤적
        x = (Math.random() - 0.5) * 0.4;
        y = 2.2;
        z = (Math.random() - 0.5) * 0.4;
        rx = Math.random() * Math.PI;
        ry = Math.random() * Math.PI;
        rz = Math.random() * Math.PI;

        // 멀티 연결되어 있으면 동료들에게 전송
        broadcastAction({ type, x, y, z, rx, ry, rz });
      }

      const wood = new Wood(type, x, y, z, rx, ry, rz);
      logs.push(wood);

      // 장작이 너무 많아지면(30개 초과) 오래된 장작 정리 (모바일 성능 보호)
      if (logs.length > 30) {
        const old = logs.shift();
        old.destroy();
      }
    };

    // ─── 4. WebRTC P2P 통신 (서버 없이 3인 연결) ───
    let peer = null;
    let connections = []; // 최대 2개의 P2P 연결 (총 3명)
    let isHost = false;

    const statusEl = document.getElementById('status');
    const roomInput = document.getElementById('room-input');

    // [호스트] 방 생성
    document.getElementById('btn-host').addEventListener('click', () => {
      peer = new Peer();
      peer.on('open', (id) => {
        isHost = true;
        roomInput.value = id;
        statusEl.innerText = `방 생성 완료! 친구에게 ID 전달: ${id}`;
      });

      peer.on('connection', (conn) => {
        if (connections.length >= 2) {
          conn.close(); // 최대 3명 정원 초과
          return;
        }
        setupConnection(conn);
      });
    });

    // [게스트] 방 참여
    document.getElementById('btn-join').addEventListener('click', () => {
      const hostId = roomInput.value.trim();
      if (!hostId) return;

      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(hostId);
        setupConnection(conn);
      });
    });

    function setupConnection(conn) {
      conn.on('open', () => {
        connections.push(conn);
        statusEl.innerText = `접속 인원: ${connections.length + 1} / 3명`;

        conn.on('data', (data) => {
          if (data.action === 'spawn') {
            spawnLog(data.type, data);
          }
        });
      });

      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        statusEl.innerText = `접속 인원: ${connections.length + 1} / 3명`;
      });
    }

    function broadcastAction(data) {
      connections.forEach(conn => {
        if (conn.open) conn.send({ action: 'spawn', ...data });
      });
    }

    // ─── 5. 메인 루프 (화력 감쇠 및 렌더링) ───
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      // 물리 시뮬레이션 스텝
      world.step(1 / 60, delta, 3);

      // 장작 업데이트
      for (let i = logs.length - 1; i >= 0; i--) {
        logs[i].update(delta);
        if (logs[i].fuel <= 0) {
          logs[i].destroy();
          logs.splice(i, 1);
        }
      }

      // 자연 화력 감소
      fireIntensity = Math.max(0, fireIntensity - 1.2 * delta);
      document.getElementById('fire-meter').innerText = `화력: ${Math.round(fireIntensity)}%`;

      // 화력에 따른 불빛 깜빡임 및 스케일 조정
      const flicker = Math.sin(Date.now() * 0.015) * 0.4 + (fireIntensity / 25);
      fireLight.intensity = Math.max(0.2, flicker);
      fireLight.color.setHSL(0.06, 1.0, Math.min(0.6, fireIntensity / 100));

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
