<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Background</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #030308;
      /* 우주 배경: 미세한 별빛 효과 */
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 100px 150px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 250px 80px, #aaa, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 320px 300px, #fff, rgba(0,0,0,0));
      background-size: 400px 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 게임 컨테이너: 화면 중앙에 지정된 폭으로 고정 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px; /* 게임 캔버스 폭 기준 */
      height: 100vh;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
    }

    /* 유튜브 배경 레이어: 영상의 중앙이 크롭되어 게임 폭에 맞도록 커버 */
    .video-background {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vh; /* 세로 화면을 꽉 채우기 위해 가로폭 확장 */
      min-width: 177.77vh; /* 16:9 비율 유지 */
      height: 100vh;
      transform: translate(-50%, -50%);
      pointer-events: none; /* 클릭 이벤트가 게임 레이어로 통과되도록 설정 */
      z-index: 1;
      opacity: 0.85; /* 필요 시 게임 요소 가독성을 위해 조절 */
    }

    /* 실제 게임 요소가 올라갈 전면 레이어 */
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 유튜브 영상이 렌더링될 영역 -->
    <div id="player" class="video-background"></div>
    
    <!-- 게임 캔버스 또는 UI 영역 -->
    <div id="game-canvas"></div>
  </div>

  <script>
    // YouTube IFrame API 비동기 로드
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'a3q2dPG3lVI',
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          loop: 1,
          playlist: 'a3q2dPG3lVI',
          modestbranding: 1,
          mute: 1,        // 모바일 자동재생 필수 정책
          playsinline: 1  // 모바일 전체화면 강제 전환 방지
        },
        events: {
          onReady: (event) => event.target.playVideo()
        }
      });
    }
  </script>
</body>
</html>
