<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D 물리 모닥불 시뮬레이션</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #050508; font-family: sans-serif; touch-action: none; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    #network-ui {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; gap: 8px; flex-wrap: wrap; z-index: 10;
      background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(4px);
      padding: 10px; border-radius: 10px; color: #fff; font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #network-ui input { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; flex: 1; min-width: 100px; font-size: 12px; }
    #network-ui button { padding: 7px 12px; border: none; border-radius: 6px; background: #ff5722; color: #fff; font-weight: bold; cursor: pointer; }
    #status { width: 100%; color: #aaa; font-size: 12px; margin-top: 2px; }

    #fire-meter {
      position: absolute; top: 90px; left: 16px; z-index: 10;
      color: #ff9800; font-weight: 800; font-size: 15px; text-shadow: 0 0 8px #000;
    }

    #controls {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10; width: 92%; max-width: 440px;
    }
    .wood-btn {
      flex: 1; padding: 14px 6px; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; font-size: 13px; font-weight: bold; color: #fff;
      cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    }
    .btn-dry { background: linear-gradient(135deg, #e64a19, #bf360c); }
    .btn-heavy { background: linear-gradient(135deg, #5d4037, #3e2723); }
    .btn-wet { background: linear-gradient(135deg, #455a64, #263238); }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="network-ui">
    <button id="btn-host">방 만들기</button>
    <input type="text" id="room-input" placeholder="호스트 ID">
    <button id="btn-join">접속</button>
    <div id="status">상태: 싱글 플레이 중 (1/3명)</div>
  </div>

  <div id="fire-meter">화력: 50%</div>

  <div id="controls">
    <button class="wood-btn btn-dry" id="btn-dry">마른 장작<br><small>화력 급상승</small></button>
    <button class="wood-btn btn-heavy" id="btn-heavy">참나무<br><small>오래 지속</small></button>
    <button class="wood-btn btn-wet" id="btn-wet">젖은 장작<br><small>연기 발생</small></button>
  </div>

  <div id="canvas-container"></div>

  <script>
    // ─── 1. Three.js & OrbitControls 기본 세팅 ───
    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.05);

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
    camera.position.set(0, 2.6, 4.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.4, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.2;
    controls.maxDistance = 10.0;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    const ambientLight = new THREE.AmbientLight(0x110a0a, 1.2);
    scene.add(ambientLight);

    const fireLight = new THREE.PointLight(0xff6611, 3.5, 10, 1.5);
    fireLight.position.set(0, 0.6, 0);
    scene.add(fireLight);

    // 바닥
    const groundMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x0c0c10, roughness: 0.95 })
    );
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    // 화로 돌 테두리
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const stone = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.22),
        new THREE.MeshStandardMaterial({ color: 0x2e2e35, roughness: 0.9 })
      );
      stone.position.set(Math.cos(angle) * 0.9, 0.1, Math.sin(angle) * 0.9);
      scene.add(stone);
    }

    // ─── 2. 리얼 모닥불 불꽃 텍스처 절차적 생성 (Canvas) ───
    function createFlameTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 128;
      cvs.height = 128;
      const ctx = cvs.getContext('2d');

      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 60);
      grad.addColorStop(0.0, 'rgba(255, 255, 230, 1.0)'); // 중심 백열광
      grad.addColorStop(0.25, 'rgba(255, 170, 20, 0.85)'); // 강한 주황
      grad.addColorStop(0.6, 'rgba(220, 50, 0, 0.4)');    // 붉은 화염
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');       // 가장자리 페이드

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(cvs);
    }

    function createSparkTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 32;
      cvs.height = 32;
      const ctx = cvs.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 14);
      grad.addColorStop(0, 'rgba(255, 240, 150, 1)');
      grad.addColorStop(0.4, 'rgba(255, 100, 0, 0.8)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 32);
      return new THREE.CanvasTexture(cvs);
    }

    const flameTexture = createFlameTexture();
    const sparkTexture = createSparkTexture();

    // ─── 3. 복합 불꽃 볼륨 빌보드 시스템 ───
    const flameCount = 35;
    const flameGroup = new THREE.Group();
    const flamePlanes = [];

    const flamePlaneGeo = new THREE.PlaneGeometry(0.8, 1.2);
    const flamePlaneMat = new THREE.MeshBasicMaterial({
      map: flameTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    for (let i = 0; i < flameCount; i++) {
      const mesh = new THREE.Mesh(flamePlaneGeo, flamePlaneMat.clone());
      flameGroup.add(mesh);
      flamePlanes.push({
        mesh: mesh,
        angle: Math.random() * Math.PI * 2,
        radius: Math.random() * 0.25,
        speedY: 1.0 + Math.random() * 1.5,
        baseScale: 0.6 + Math.random() * 0.5,
        life: Math.random(),
        seed: Math.random() * 100
      });
    }
    scene.add(flameGroup);

    // ─── 4. 불티(Spark) 파티클 시스템 ───
    const sparkCount = 60;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPositions = new Float32Array(sparkCount * 3);
    const sparkData = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPositions[i * 3 + 0] = (Math.random() - 0.5) * 0.4;
      sparkPositions[i * 3 + 1] = 0.1 + Math.random() * 0.5;
      sparkPositions[i * 3 + 2] = (Math.random() - 0.5) * 0.4;

      sparkData.push({
        vy: 1.2 + Math.random() * 2.0,
        vx: (Math.random() - 0.5) * 0.5,
        vz: (Math.random() - 0.5) * 0.5
      });
    }

    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
    const sparkMat = new THREE.PointsMaterial({
      map: sparkTexture,
      size: 0.08,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkSystem = new THREE.Points(sparkGeo, sparkMat);
    scene.add(sparkSystem);

    // ─── 5. CANNON 물리 엔진 ───
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    const groundBody = new CANNON.Body({ mass: 0 });
    groundBody.addShape(new CANNON.Plane());
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    // ─── 6. 장작 및 화력 로직 ───
    let logs = [];
    let fireIntensity = 50.0;

    class WoodLog {
      constructor(type, x, y, z, rx, ry, rz) {
        this.type = type;
        this.fuel = type === 'heavy' ? 80 : (type === 'dry' ? 30 : 50);
        this.maxFuel = this.fuel;

        const radius = type === 'heavy' ? 0.12 : 0.08;
        const length = type === 'heavy' ? 0.75 : 0.6;

        this.body = new CANNON.Body({
          mass: type === 'heavy' ? 2.5 : 1.0,
          shape: new CANNON.Box(new CANNON.Vec3(radius, length / 2, radius))
        });
        this.body.position.set(x, y, z);
        this.body.quaternion.setFromEuler(rx, ry, rz);
        world.addBody(this.body);

        const logMat = new THREE.MeshStandardMaterial({
          color: type === 'dry' ? 0x935128 : (type === 'heavy' ? 0x4a2a18 : 0x3d4952),
          roughness: 0.85
        });
        this.mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 8), logMat);
        this.mesh.castShadow = true;
        scene.add(this.mesh);
      }

      update(delta) {
        this.mesh.position.copy(this.body.position);
        this.mesh.quaternion.copy(this.body.quaternion);

        const dist = Math.hypot(this.body.position.x, this.body.position.z);
        if (dist < 1.0 && fireIntensity > 2.0 && this.fuel > 0) {
          const burnSpeed = (this.type === 'wet' ? 0.4 : 1.2) * delta;
          this.fuel -= burnSpeed;

          const r = Math.max(0.1, this.fuel / this.maxFuel);
          this.mesh.material.color.setRGB(r * 0.55, r * 0.25, r * 0.1);

          if (this.type === 'dry') fireIntensity = Math.min(100, fireIntensity + 6.0 * delta);
          else if (this.type === 'heavy') fireIntensity = Math.min(100, fireIntensity + 2.5 * delta);
          else fireIntensity = Math.max(0.5, fireIntensity - 2.5 * delta);
        }
      }

      destroy() {
        world.removeBody(this.body);
        scene.remove(this.mesh);
      }
    }

    function spawnLog(type, syncData) {
      let x, y, z, rx, ry, rz;
      if (syncData) {
        ({ x, y, z, rx, ry, rz } = syncData);
      } else {
        x = (Math.random() - 0.5) * 0.3;
        y = 2.0;
        z = (Math.random() - 0.5) * 0.3;
        rx = Math.random() * Math.PI;
        ry = Math.random() * Math.PI;
        rz = Math.random() * Math.PI;
        broadcast({ action: 'spawn', type, x, y, z, rx, ry, rz });
      }

      const log = new WoodLog(type, x, y, z, rx, ry, rz);
      logs.push(log);

      if (logs.length > 25) {
        logs.shift().destroy();
      }
    }

    document.getElementById('btn-dry').addEventListener('click', () => spawnLog('dry'));
    document.getElementById('btn-heavy').addEventListener('click', () => spawnLog('heavy'));
    document.getElementById('btn-wet').addEventListener('click', () => spawnLog('wet'));

    // ─── 7. PeerJS P2P 통신 ───
    let peer = null;
    let connections = [];
    const statusEl = document.getElementById('status');
    const roomInput = document.getElementById('room-input');

    document.getElementById('btn-host').addEventListener('click', () => {
      peer = new Peer();
      peer.on('open', (id) => {
        roomInput.value = id;
        statusEl.innerText = `방 생성 완료! ID 공유: ${id}`;
      });
      peer.on('connection', (conn) => {
        if (connections.length >= 2) return conn.close();
        setupConn(conn);
      });
    });

    document.getElementById('btn-join').addEventListener('click', () => {
      const targetId = roomInput.value.trim();
      if (!targetId) return;
      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(targetId);
        setupConn(conn);
      });
    });

    function setupConn(conn) {
      conn.on('open', () => {
        connections.push(conn);
        statusEl.innerText = `접속자: ${connections.length + 1} / 3명`;
        conn.on('data', (d) => {
          if (d.action === 'spawn') spawnLog(d.type, d);
        });
      });
      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        statusEl.innerText = `접속자: ${connections.length + 1} / 3명`;
      });
    }

    function broadcast(data) {
      connections.forEach(c => { if (c.open) c.send(data); });
    }

    // ─── 8. 메인 렌더 및 물리 루프 ───
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsedTime = clock.getElapsedTime();

      controls.update();
      world.step(1 / 60, delta, 3);

      for (let i = logs.length - 1; i >= 0; i--) {
        logs[i].update(delta);
        if (logs[i].fuel <= 0) {
          logs[i].destroy();
          logs.splice(i, 1);
        }
      }

      // 자연 화력 감소
      fireIntensity = Math.max(0, fireIntensity - 0.7 * delta);
      document.getElementById('fire-meter').innerText = `화력: ${Math.round(fireIntensity)}%`;

      const power = fireIntensity / 50.0;

      // 1) 개별 불꽃 쿼드 시뮬레이션 (상승, 페이드, 카메라 빌보드)
      flamePlanes.forEach(fp => {
        fp.life += delta * fp.speedY * (0.6 + power * 0.4);
        if (fp.life > 1.0) {
          fp.life = 0;
          fp.angle = Math.random() * Math.PI * 2;
          fp.radius = Math.random() * 0.25 * power;
        }

        // 바닥에서 상승하며 위로 갈수록 좁아짐
        const y = fp.life * (0.9 + power * 1.0);
        const taper = 1.0 - fp.life * 0.6;
        const currentR = fp.radius * taper;
        
        // 자연스러운 너울거림 추가
        const wobbleX = Math.sin(elapsedTime * 5.0 + fp.seed) * 0.05 * fp.life;
        const wobbleZ = Math.cos(elapsedTime * 5.0 + fp.seed) * 0.05 * fp.life;

        fp.mesh.position.set(
          Math.cos(fp.angle) * currentR + wobbleX,
          0.15 + y,
          Math.sin(fp.angle) * currentR + wobbleZ
        );

        // 항상 카메라를 바라봄 (빌보드)
        fp.mesh.quaternion.copy(camera.quaternion);

        // 크기 및 투명도 라이프사이클
        const scale = fp.baseScale * taper * Math.min(1.5, Math.max(0.2, power));
        fp.mesh.scale.set(scale, scale * 1.3, 1);

        // 생성 직후 부드럽게 켜지고, 소멸 시 페이드아웃
        let alpha = 1.0;
        if (fp.life < 0.2) alpha = fp.life / 0.2;
        else alpha = (1.0 - fp.life) / 0.8;
        fp.mesh.material.opacity = alpha * Math.min(1.0, power * 0.9);
      });

      // 2) 조명 깜빡임 연동
      const flicker = Math.sin(elapsedTime * 20.0) * 0.4 + (fireIntensity / 18.0);
      fireLight.intensity = Math.max(0.2, flicker);
      fireLight.position.y = 0.5 + Math.sin(elapsedTime * 10.0) * 0.1;

      // 3) 불티 파티클
      const pos = sparkSystem.geometry.attributes.position.array;
      for (let i = 0; i < sparkCount; i++) {
        const vel = sparkData[i];
        pos[i * 3 + 1] += vel.vy * delta * (0.6 + power * 0.6);
        pos[i * 3 + 0] += Math.sin(elapsedTime * 3.0 + i) * 0.005;
        pos[i * 3 + 2] += Math.cos(elapsedTime * 3.0 + i) * 0.005;

        if (pos[i * 3 + 1] > (1.0 + power * 1.6)) {
          pos[i * 3 + 0] = (Math.random() - 0.5) * 0.35 * power;
          pos[i * 3 + 1] = 0.15;
          pos[i * 3 + 2] = (Math.random() - 0.5) * 0.35 * power;
        }
      }
      sparkSystem.geometry.attributes.position.needsUpdate = true;
      sparkMat.opacity = Math.min(1.0, power);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    animate();
  </script>
</body>
</html>
