<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Dessert Arkanoid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2b170e;
            font-family: 'Arial Rounded MT Bold', 'Fredoka One', 'Comic Sans MS', sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 우드 테이블 상단 초콜릿 스타일 UI */
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 10;
        }
        .hud-text {
            color: #4a2711;
            font-size: clamp(18px, 4.5vw, 32px);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 
                -1px -1px 0 #7b421e,
                1px 1px 2px #fff3d6,
                2px 3px 4px rgba(0,0,0,0.6);
            background: rgba(235, 215, 185, 0.7);
            padding: 6px 18px;
            border-radius: 20px;
            border: 2px solid #5a3118;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        /* 시작/게임오버 오버레이 */
        #msg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 15, 8, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #msg-title {
            font-size: clamp(26px, 7vw, 44px);
            color: #ffd89b;
            text-shadow: 2px 3px 0 #a34e00;
            margin-bottom: 15px;
        }
        #msg-sub {
            font-size: clamp(15px, 4vw, 20px);
            color: #ffe6cf;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .cookie-btn {
            background: linear-gradient(145deg, #f0a354, #b8621d);
            border: 3px solid #6b3305;
            color: #381a03;
            font-size: clamp(18px, 4.5vw, 24px);
            font-weight: bold;
            padding: 14px 34px;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 0 #4a2100, 0 10px 15px rgba(0,0,0,0.4);
            pointer-events: auto;
            transition: transform 0.1s;
        }
        .cookie-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4a2100;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div class="hud-text">SCORE: <span id="score-val">000000</span></div>
        <div class="hud-text">LIVES: <span id="lives-val">3</span></div>
    </div>

    <div id="msg-overlay">
        <div id="msg-title">SWEET ARユーザー NOID 3D</div>
        <div id="msg-sub">화면을 좌우로 터치/드래그하여<br>패들을 조작하세요!</div>
        <button class="cookie-btn" id="start-btn">TAP TO PLAY</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 게임 기본 파라미터 ---
        const ARENA_WIDTH = 26;
        const ARENA_HEIGHT = 38;
        const WALL_THICK = 1.4;
        const WALL_HEIGHT = 1.8;

        let score = 0;
        let lives = 3;
        let isRunning = false;
        let isBallAttached = true;

        // Three.js 인스턴스
        let scene, camera, renderer;
        let paddle, ball;
        let blocks = [];
        let particles = [];
        let ballVel = new THREE.Vector3(0, 0, 0);
        const BALL_SPEED = 24.0;

        // 색상 팔레트 (원작 이미지 기반 초콜릿/디저트 색감)
        const COLOR_PALETTE = [
            0xaf3a41, // 딸기/레드벨벳
            0xd9824c, // 카라멜
            0xf2b568, // 바닐라 크림
            0x60341e, // 다크 초콜릿
            0x98572b, // 밀크 초콜릿
            0xedd087, // 커스터드 옐로우
            0x7c9b68, // 말차 그린
            0x53779e, // 블루베리 밀크
            0xf7f4e9  // 화이트 초콜릿
        ];

        // --- 재질 사전 ---
        let matCookieCrust, matBiscuitBase, matBall, matFloor;

        function initMaterials() {
            // 타르트 크러스트 외벽
            matCookieCrust = new THREE.MeshStandardMaterial({
                color: 0xd6995c,
                roughness: 0.85,
                metalness: 0.05
            });

            // 블록 및 패들의 비스킷 베이스
            matBiscuitBase = new THREE.MeshStandardMaterial({
                color: 0xdfa56b,
                roughness: 0.9,
                metalness: 0.0
            });

            // 메탈릭 실버 트러플 구슬 공
            matBall = new THREE.MeshStandardMaterial({
                color: 0xeaeaea,
                metalness: 0.85,
                roughness: 0.15
            });

            // 플레이그라운드 베이킹 매트 바닥
            matFloor = new THREE.MeshStandardMaterial({
                color: 0xf5eedc,
                roughness: 0.95,
                metalness: 0.0
            });
        }

        function initScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x381e13); // 원목 테이블 색상

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCamera();

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            initMaterials();

            // --- 조명 설정 ---
            const ambLight = new THREE.AmbientLight(0xfff4e6, 0.7);
            scene.add(ambLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
            dirLight.position.set(10, 30, 25);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 5;
            dirLight.shadow.camera.far = 80;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 25;
            dirLight.shadow.camera.bottom = -25;
            dirLight.shadow.bias = -0.001;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xffb870, 0.6, 40);
            pointLight.position.set(0, 15, -10);
            scene.add(pointLight);

            buildBoard();
            buildPaddle();
            buildBall();
            spawnBlocks();

            window.addEventListener('resize', onWindowResize);
            setupInput();
        }

        // 모바일 비율에 맞춰 카메라 거리 자동 산출
        function updateCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            let targetDist;
            if (aspect < 1) {
                targetDist = 48 / aspect; // 세로 화면
            } else {
                targetDist = 45; // 가로 화면
            }
            camera.position.set(0, targetDist * 0.95, targetDist * 0.65);
            camera.lookAt(0, 0, 1.5);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            updateCamera();
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 경기장 (바닥 + 타르트 테두리 벽) ---
        function buildBoard() {
            // 바닥
            const floorGeo = new THREE.BoxGeometry(ARENA_WIDTH, 0.4, ARENA_HEIGHT);
            const floorMesh = new THREE.Mesh(floorGeo, matFloor);
            floorMesh.position.y = -0.2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // 타르트 크러스트 외벽 (좌, 우, 상단)
            const wallMat = matCookieCrust;
            const wallH = WALL_HEIGHT;
            const wallT = WALL_THICK;

            // 상단 벽
            const topGeo = new THREE.BoxGeometry(ARENA_WIDTH + wallT * 2, wallH, wallT);
            const topWall = new THREE.Mesh(topGeo, wallMat);
            topWall.position.set(0, wallH / 2, -ARENA_HEIGHT / 2 - wallT / 2);
            topWall.castShadow = true;
            topWall.receiveShadow = true;
            scene.add(topWall);

            // 좌측 벽
            const sideGeo = new THREE.BoxGeometry(wallT, wallH, ARENA_HEIGHT);
            const leftWall = new THREE.Mesh(sideGeo, wallMat);
            leftWall.position.set(-ARENA_WIDTH / 2 - wallT / 2, wallH / 2, 0);
            leftWall.castShadow = true;
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            // 우측 벽
            const rightWall = new THREE.Mesh(sideGeo, wallMat);
            rightWall.position.set(ARENA_WIDTH / 2 + wallT / 2, wallH / 2, 0);
            rightWall.castShadow = true;
            rightWall.receiveShadow = true;
            scene.add(rightWall);
        }

        // --- 웨이퍼 & 초콜릿 블록 패들 ---
        function buildPaddle() {
            paddle = new THREE.Group();

            const pW = 6.2;
            const pH = 1.0;
            const pD = 1.6;

            // 하단 웨이퍼 비스킷
            const baseGeo = new THREE.BoxGeometry(pW, pH * 0.4, pD);
            const baseMesh = new THREE.Mesh(baseGeo, matBiscuitBase);
            baseMesh.position.y = pH * 0.2;
            baseMesh.castShadow = true;
            baseMesh.receiveShadow = true;
            paddle.add(baseMesh);

            // 상단 분할 초콜릿 세그먼트 (킨더 초콜릿 스타일)
            const segCount = 7;
            const segW = (pW - 0.4) / segCount;
            for (let i = 0; i < segCount; i++) {
                const segGeo = new THREE.BoxGeometry(segW * 0.88, pH * 0.6, pD * 0.85);
                const segMat = new THREE.MeshStandardMaterial({
                    color: (i % 2 === 0) ? 0xf4eee4 : 0x733e1e, // 화이트 / 밀크 초콜릿 교차
                    roughness: 0.35,
                    metalness: 0.1
                });
                const segMesh = new THREE.Mesh(segGeo, segMat);
                segMesh.position.set(-pW / 2 + 0.2 + segW * (i + 0.5), pH * 0.7, 0);
                segMesh.castShadow = true;
                paddle.add(segMesh);
            }

            paddle.position.set(0, 0, ARENA_HEIGHT / 2 - 3.5);
            paddle.width = pW;
            paddle.depth = pD;
            scene.add(paddle);
        }

        // --- 메탈릭 실버 트러플 구슬 볼 ---
        function buildBall() {
            const radius = 0.65;
            const ballGeo = new THREE.SphereGeometry(radius, 32, 32);
            ball = new THREE.Mesh(ballGeo, matBall);
            ball.castShadow = true;
            ball.radius = radius;
            resetBall();
            scene.add(ball);
        }

        function resetBall() {
            isBallAttached = true;
            ballVel.set(0, 0, 0);
            if (paddle) {
                ball.position.set(paddle.position.x, ball.radius, paddle.position.z - 1.2);
            }
        }

        function launchBall() {
            if (!isBallAttached) return;
            isBallAttached = false;
            // 살짝 랜덤한 각도로 상향 발사
            const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // -45도 ~ +45도
            ballVel.set(Math.sin(angle) * BALL_SPEED, 0, -Math.cos(angle) * BALL_SPEED);
        }

        // --- 2단 초콜릿-비스킷 블록 생성 ---
        function spawnBlocks() {
            // 이전 블록 제거
            blocks.forEach(b => scene.remove(b.group));
            blocks = [];

            const cols = 9;
            const rows = 5;
            const bWidth = 2.45;
            const bDepth = 1.9;
            const bHeight = 0.9;
            const gap = 0.28;

            const startX = -((cols * (bWidth + gap) - gap) / 2) + bWidth / 2;
            const startZ = -ARENA_HEIGHT / 2 + 3.8;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const blockGroup = new THREE.Group();

                    // 1단: 비스킷 베이스
                    const baseGeo = new THREE.BoxGeometry(bWidth, bHeight * 0.45, bDepth);
                    const baseMesh = new THREE.Mesh(baseGeo, matBiscuitBase);
                    baseMesh.position.y = bHeight * 0.225;
                    baseMesh.castShadow = true;
                    baseMesh.receiveShadow = true;
                    blockGroup.add(baseMesh);

                    // 2단: 둥근 광택 초콜릿 토핑
                    const chocMat = new THREE.MeshStandardMaterial({
                        color: COLOR_PALETTE[(r * 2 + c) % COLOR_PALETTE.length],
                        roughness: 0.28,
                        metalness: 0.12
                    });
                    const topGeo = new THREE.BoxGeometry(bWidth * 0.85, bHeight * 0.55, bDepth * 0.85);
                    const topMesh = new THREE.Mesh(topGeo, chocMat);
                    topMesh.position.y = bHeight * 0.725;
                    topMesh.castShadow = true;
                    topMesh.receiveShadow = true;
                    blockGroup.add(topMesh);

                    const x = startX + c * (bWidth + gap);
                    const z = startZ + r * (bDepth + gap);
                    blockGroup.position.set(x, 0, z);

                    scene.add(blockGroup);

                    blocks.push({
                        group: blockGroup,
                        x: x,
                        z: z,
                        halfW: bWidth / 2,
                        halfD: bDepth / 2,
                        color: chocMat.color
                    });
                }
            }
        }

        // --- 부스러기(파티클) 폭발 이펙트 ---
        function createCrumbExplosion(x, z, color) {
            const count = 12;
            const crumbMat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.8
            });

            for (let i = 0; i < count; i++) {
                const size = 0.15 + Math.random() * 0.25;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), crumbMat);
                mesh.position.set(x, 0.5, z);
                mesh.castShadow = true;
                scene.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 8;
                particles.push({
                    mesh: mesh,
                    vx: Math.cos(angle) * speed,
                    vy: 4 + Math.random() * 6,
                    vz: Math.sin(angle) * speed,
                    life: 1.0
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= dt * 2.2;
                p.vy -= 22 * dt; // 중력
                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;

                p.mesh.rotation.x += 4 * dt;
                p.mesh.rotation.y += 4 * dt;

                if (p.mesh.position.y <= 0.1) {
                    p.mesh.position.y = 0.1;
                    p.vy = -p.vy * 0.4;
                }

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        // --- 터치 및 마우스 입력 제어 ---
        let targetPaddleX = 0;

        function setupInput() {
            const canvas = renderer.domElement;

            function processScreenCoord(clientX) {
                const normX = (clientX / window.innerWidth) * 2 - 1;
                // 카메라 투영 기반 평면 변환 근사치
                const xLimit = ARENA_WIDTH / 2 - paddle.width / 2;
                targetPaddleX = normX * (ARENA_WIDTH * 0.58);
                targetPaddleX = Math.max(-xLimit, Math.min(xLimit, targetPaddleX));

                if (isBallAttached && isRunning) {
                    launchBall();
                }
            }

            window.addEventListener('pointerdown', (e) => {
                processScreenCoord(e.clientX);
            });

            window.addEventListener('pointermove', (e) => {
                if (e.buttons > 0 || e.pointerType === 'touch') {
                    processScreenCoord(e.clientX);
                }
            });
        }

        // --- 물리 및 충돌 루프 ---
        function updatePhysics(dt) {
            // 패들 보간 이동 (부드러운 조작감)
            paddle.position.x += (targetPaddleX - paddle.position.x) * 18 * dt;

            if (isBallAttached) {
                ball.position.x = paddle.position.x;
                ball.position.z = paddle.position.z - 1.2;
                return;
            }

            // 구슬 위치 갱신
            ball.position.x += ballVel.x * dt;
            ball.position.z += ballVel.z * dt;

            // 1. 경기장 좌/우 벽 충돌
            const xLimit = ARENA_WIDTH / 2 - ball.radius;
            if (ball.position.x <= -xLimit) {
                ball.position.x = -xLimit;
                ballVel.x *= -1;
            } else if (ball.position.x >= xLimit) {
                ball.position.x = xLimit;
                ballVel.x *= -1;
            }

            // 2. 상단 벽 충돌
            const topLimit = -ARENA_HEIGHT / 2 + ball.radius;
            if (ball.position.z <= topLimit) {
                ball.position.z = topLimit;
                ballVel.z *= -1;
            }

            // 3. 패들과의 충돌
            const padZ = paddle.position.z;
            const padHalfW = paddle.width / 2;
            const padHalfD = paddle.depth / 2;

            if (ball.position.z + ball.radius >= padZ - padHalfD &&
                ball.position.z - ball.radius <= padZ + padHalfD &&
                ball.position.x >= paddle.position.x - padHalfW - ball.radius &&
                ball.position.x <= paddle.position.x + padHalfW + ball.radius &&
                ballVel.z > 0) {

                ball.position.z = padZ - padHalfD - ball.radius;

                // 패들의 맞은 위치에 따라 반사 각도 조절 (-60도 ~ +60도)
                const hitOffset = (ball.position.x - paddle.position.x) / padHalfW;
                const bounceAngle = hitOffset * (Math.PI / 3);

                const currentSpeed = ballVel.length();
                ballVel.x = Math.sin(bounceAngle) * currentSpeed;
                ballVel.z = -Math.cos(bounceAngle) * currentSpeed;
            }

            // 4. 블록과의 충돌
            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                const dx = ball.position.x - b.x;
                const dz = ball.position.z - b.z;

                const overlapX = (b.halfW + ball.radius) - Math.abs(dx);
                const overlapZ = (b.halfD + ball.radius) - Math.abs(dz);

                if (overlapX > 0 && overlapZ > 0) {
                    // 충돌 축 판별
                    if (overlapX < overlapZ) {
                        ballVel.x *= -1;
                        ball.position.x += (dx > 0 ? overlapX : -overlapX);
                    } else {
                        ballVel.z *= -1;
                        ball.position.z += (dz > 0 ? overlapZ : -overlapZ);
                    }

                    // 파티클 생성 및 블록 제거
                    createCrumbExplosion(b.x, b.z, b.color);
                    scene.remove(b.group);
                    blocks.splice(i, 1);

                    score += 150;
                    document.getElementById('score-val').innerText = score.toString().padStart(6, '0');

                    // 전부 깼을 때 스테이지 클리어
                    if (blocks.length === 0) {
                        showGameOver("STAGE CLEARED!", "달콤하게 모든 비스킷을 부수었습니다!");
                    }
                    break;
                }
            }

            // 5. 하단 낙하 (미스)
            if (ball.position.z > ARENA_HEIGHT / 2 + 2.0) {
                lives--;
                document.getElementById('lives-val').innerText = lives;
                if (lives > 0) {
                    resetBall();
                } else {
                    showGameOver("GAME OVER", "다시 도전해보세요!");
                }
            }
        }

        function showGameOver(title, sub) {
            isRunning = false;
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-sub').innerHTML = sub;
            document.getElementById('start-btn').innerText = "PLAY AGAIN";
            document.getElementById('msg-overlay').style.display = "flex";
        }

        function startGame() {
            score = 0;
            lives = 3;
            document.getElementById('score-val').innerText = "000000";
            document.getElementById('lives-val').innerText = "3";
            document.getElementById('msg-overlay').style.display = "none";
            spawnBlocks();
            resetBall();
            isRunning = true;
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            startGame();
        });

        // --- 메인 렌더 루프 ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.033); // 최대 30fps 지연 보정

            if (isRunning) {
                updatePhysics(dt);
            }
            updateParticles(dt);

            renderer.render(scene, camera);
        }

        // 초기화 실행
        initScene();
        animate();
    </script>
</body>
</html>
