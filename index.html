<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Dessert Arkanoid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2b170e;
            font-family: 'Arial Rounded MT Bold', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 우드 테이블 상단 초콜릿 스타일 UI */
        #ui-layer {
            position: absolute;
            top: 12px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            pointer-events: none;
            z-index: 10;
        }
        .hud-text {
            color: #3d1c08;
            font-size: clamp(15px, 4vw, 22px);
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
            background: rgba(240, 220, 190, 0.85);
            padding: 6px 14px;
            border-radius: 16px;
            border: 2px solid #5a3118;
            box-shadow: 0 4px 8px rgba(0,0,0,0.35);
        }
        /* 시작/게임오버 오버레이 */
        #msg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 15, 8, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #msg-title {
            font-size: clamp(26px, 7vw, 42px);
            color: #ffd89b;
            text-shadow: 2px 3px 0 #a34e00;
            margin-bottom: 12px;
        }
        #msg-sub {
            font-size: clamp(14px, 4vw, 18px);
            color: #ffe6cf;
            margin-bottom: 26px;
            line-height: 1.5;
        }
        .cookie-btn {
            background: linear-gradient(145deg, #f0a354, #b8621d);
            border: 3px solid #6b3305;
            color: #381a03;
            font-size: clamp(18px, 4.5vw, 22px);
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 0 #4a2100, 0 8px 12px rgba(0,0,0,0.4);
            pointer-events: auto;
            transition: transform 0.1s;
        }
        .cookie-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #4a2100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div class="hud-text">SCORE: <span id="score-val">000000</span></div>
        <div class="hud-text">LIVES: <span id="lives-val">3</span></div>
    </div>

    <div id="msg-overlay">
        <div id="msg-title">SWEET ARKANOID 3D</div>
        <div id="msg-sub">화면 하단을 좌우로 터치/드래그하여<br>패들을 조작하세요!</div>
        <button class="cookie-btn" id="start-btn">TAP TO PLAY</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 보드 파라미터 (세로 화면 비율에 맞춤) ---
        const ARENA_WIDTH = 22;
        const ARENA_HEIGHT = 42;
        const WALL_THICK = 1.3;
        const WALL_HEIGHT = 1.6;

        let score = 0;
        let lives = 3;
        let isRunning = false;
        let isBallAttached = true;

        let scene, camera, renderer;
        let paddle, ball;
        let blocks = [];
        let particles = [];
        let ballVel = new THREE.Vector3(0, 0, 0);
        const BALL_SPEED = 27.0;

        const COLOR_PALETTE = [
            0xaf3a41, 0xd9824c, 0xf2b568, 
            0x60341e, 0x98572b, 0xedd087, 
            0x7c9b68, 0x53779e, 0xf7f4e9
        ];

        let matCookieCrust, matBiscuitBase, matBall, matFloor;

        function initMaterials() {
            matCookieCrust = new THREE.MeshStandardMaterial({
                color: 0xdca263,
                roughness: 0.8,
                metalness: 0.05
            });

            matBiscuitBase = new THREE.MeshStandardMaterial({
                color: 0xe0ab75,
                roughness: 0.85,
                metalness: 0.0
            });

            matBall = new THREE.MeshStandardMaterial({
                color: 0x222222, // 흑진주/다크 메탈 볼
                metalness: 0.9,
                roughness: 0.15
            });

            matFloor = new THREE.MeshStandardMaterial({
                color: 0xfffcf7,
                roughness: 0.9,
                metalness: 0.0
            });
        }

        // 모바일 세로 비율에 꼭 맞추는 카메라 자동 핏팅
        function fitCameraToBoard() {
            const aspect = window.innerWidth / window.innerHeight;
            const targetHeight = ARENA_HEIGHT + 4.5;
            const targetWidth = ARENA_WIDTH + WALL_THICK * 2 + 1.0;

            // 시야각(FOV) 기반 세로/가로 요구 거리 계산
            const fovRad = (camera.fov * Math.PI) / 180;
            const distV = (targetHeight / 2) / Math.tan(fovRad / 2);
            const distH = (targetWidth / 2) / (Math.tan(fovRad / 2) * aspect);

            // 화면에 꽉 차도록 여백 최소화
            const camDistance = Math.max(distV, distH) * 1.02;

            // 살짝 비스듬한 3D 입체감을 유지하며 줌인
            const tiltAngle = 0.28; // 약 16도 틸트
            camera.position.set(0, camDistance * Math.cos(tiltAngle), camDistance * Math.sin(tiltAngle) * 0.45);
            camera.lookAt(0, 0, -1.0);
        }

        function initScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x381e13);

            camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
            fitCameraToBoard();

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            initMaterials();

            // 조명
            const ambLight = new THREE.AmbientLight(0xfff6ea, 0.75);
            scene.add(ambLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.25);
            dirLight.position.set(12, 35, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 5;
            dirLight.shadow.camera.far = 70;
            dirLight.shadow.camera.left = -15;
            dirLight.shadow.camera.right = 15;
            dirLight.shadow.camera.top = 25;
            dirLight.shadow.camera.bottom = -25;
            dirLight.shadow.bias = -0.001;
            scene.add(dirLight);

            buildBoard();
            buildPaddle();
            buildBall();
            spawnBlocks();

            window.addEventListener('resize', onWindowResize);
            setupInput();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            fitCameraToBoard();
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function buildBoard() {
            // 바닥
            const floorGeo = new THREE.BoxGeometry(ARENA_WIDTH, 0.4, ARENA_HEIGHT);
            const floorMesh = new THREE.Mesh(floorGeo, matFloor);
            floorMesh.position.y = -0.2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // 타르트 비스킷 테두리 벽
            const wallMat = matCookieCrust;
            const wallH = WALL_HEIGHT;
            const wallT = WALL_THICK;

            // 상단
            const topGeo = new THREE.BoxGeometry(ARENA_WIDTH + wallT * 2, wallH, wallT);
            const topWall = new THREE.Mesh(topGeo, wallMat);
            topWall.position.set(0, wallH / 2, -ARENA_HEIGHT / 2 - wallT / 2);
            topWall.castShadow = true;
            topWall.receiveShadow = true;
            scene.add(topWall);

            // 좌측
            const sideGeo = new THREE.BoxGeometry(wallT, wallH, ARENA_HEIGHT);
            const leftWall = new THREE.Mesh(sideGeo, wallMat);
            leftWall.position.set(-ARENA_WIDTH / 2 - wallT / 2, wallH / 2, 0);
            leftWall.castShadow = true;
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            // 우측
            const rightWall = new THREE.Mesh(sideGeo, wallMat);
            rightWall.position.set(ARENA_WIDTH / 2 + wallT / 2, wallH / 2, 0);
            rightWall.castShadow = true;
            rightWall.receiveShadow = true;
            scene.add(rightWall);
        }

        function buildPaddle() {
            paddle = new THREE.Group();

            const pW = 5.6;
            const pH = 0.9;
            const pD = 1.5;

            // 웨이퍼 비스킷 베이스
            const baseGeo = new THREE.BoxGeometry(pW, pH * 0.45, pD);
            const baseMesh = new THREE.Mesh(baseGeo, matBiscuitBase);
            baseMesh.position.y = pH * 0.225;
            baseMesh.castShadow = true;
            baseMesh.receiveShadow = true;
            paddle.add(baseMesh);

            // 초콜릿 세그먼트
            const segCount = 6;
            const segW = (pW - 0.3) / segCount;
            for (let i = 0; i < segCount; i++) {
                const segGeo = new THREE.BoxGeometry(segW * 0.88, pH * 0.55, pD * 0.85);
                const segMat = new THREE.MeshStandardMaterial({
                    color: (i % 2 === 0) ? 0xf5ebd7 : 0x733f20,
                    roughness: 0.35
                });
                const segMesh = new THREE.Mesh(segGeo, segMat);
                segMesh.position.set(-pW / 2 + 0.15 + segW * (i + 0.5), pH * 0.7, 0);
                segMesh.castShadow = true;
                paddle.add(segMesh);
            }

            paddle.position.set(0, 0, ARENA_HEIGHT / 2 - 4.5);
            paddle.width = pW;
            paddle.depth = pD;
            scene.add(paddle);
        }

        function buildBall() {
            const radius = 0.65;
            const ballGeo = new THREE.SphereGeometry(radius, 32, 32);
            ball = new THREE.Mesh(ballGeo, matBall);
            ball.castShadow = true;
            ball.radius = radius;
            resetBall();
            scene.add(ball);
        }

        function resetBall() {
            isBallAttached = true;
            ballVel.set(0, 0, 0);
            if (paddle) {
                ball.position.set(paddle.position.x, ball.radius, paddle.position.z - 1.2);
            }
        }

        function launchBall() {
            if (!isBallAttached) return;
            isBallAttached = false;
            const angle = (Math.random() * 0.4 - 0.2) * Math.PI;
            ballVel.set(Math.sin(angle) * BALL_SPEED, 0, -Math.cos(angle) * BALL_SPEED);
        }

        function spawnBlocks() {
            blocks.forEach(b => scene.remove(b.group));
            blocks = [];

            const cols = 8;
            const rows = 5;
            const bWidth = 2.3;
            const bDepth = 1.7;
            const bHeight = 0.85;
            const gap = 0.25;

            const startX = -((cols * (bWidth + gap) - gap) / 2) + bWidth / 2;
            const startZ = -ARENA_HEIGHT / 2 + 3.8;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const blockGroup = new THREE.Group();

                    // 비스킷 베이스
                    const baseGeo = new THREE.BoxGeometry(bWidth, bHeight * 0.45, bDepth);
                    const baseMesh = new THREE.Mesh(baseGeo, matBiscuitBase);
                    baseMesh.position.y = bHeight * 0.225;
                    baseMesh.castShadow = true;
                    baseMesh.receiveShadow = true;
                    blockGroup.add(baseMesh);

                    // 초콜릿 토핑
                    const chocMat = new THREE.MeshStandardMaterial({
                        color: COLOR_PALETTE[(r * 2 + c) % COLOR_PALETTE.length],
                        roughness: 0.28,
                        metalness: 0.1
                    });
                    const topGeo = new THREE.BoxGeometry(bWidth * 0.86, bHeight * 0.55, bDepth * 0.86);
                    const topMesh = new THREE.Mesh(topGeo, chocMat);
                    topMesh.position.y = bHeight * 0.725;
                    topMesh.castShadow = true;
                    topMesh.receiveShadow = true;
                    blockGroup.add(topMesh);

                    const x = startX + c * (bWidth + gap);
                    const z = startZ + r * (bDepth + gap);
                    blockGroup.position.set(x, 0, z);

                    scene.add(blockGroup);

                    blocks.push({
                        group: blockGroup,
                        x: x,
                        z: z,
                        halfW: bWidth / 2,
                        halfD: bDepth / 2,
                        color: chocMat.color
                    });
                }
            }
        }

        function createCrumbExplosion(x, z, color) {
            const count = 10;
            const crumbMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 });

            for (let i = 0; i < count; i++) {
                const size = 0.15 + Math.random() * 0.2;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), crumbMat);
                mesh.position.set(x, 0.5, z);
                mesh.castShadow = true;
                scene.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 7;
                particles.push({
                    mesh: mesh,
                    vx: Math.cos(angle) * speed,
                    vy: 3 + Math.random() * 5,
                    vz: Math.sin(angle) * speed,
                    life: 1.0
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= dt * 2.2;
                p.vy -= 22 * dt;
                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;

                p.mesh.rotation.x += 4 * dt;
                p.mesh.rotation.y += 4 * dt;

                if (p.mesh.position.y <= 0.1) {
                    p.mesh.position.y = 0.1;
                    p.vy = -p.vy * 0.35;
                }

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        // 터치 입력 (패들 X위치와 1:1 매핑)
        let targetPaddleX = 0;
        const raycaster = new THREE.Raycaster();
        const touchPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // y=0 평면
        const rayPos = new THREE.Vector3();

        function setupInput() {
            function handlePointer(e) {
                const ndcX = (e.clientX / window.innerWidth) * 2 - 1;
                const ndcY = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
                if (raycaster.ray.intersectPlane(touchPlane, rayPos)) {
                    const xLimit = ARENA_WIDTH / 2 - paddle.width / 2;
                    targetPaddleX = Math.max(-xLimit, Math.min(xLimit, rayPos.x));
                }

                if (isBallAttached && isRunning) {
                    launchBall();
                }
            }

            window.addEventListener('pointerdown', handlePointer);
            window.addEventListener('pointermove', (e) => {
                if (e.buttons > 0 || e.pointerType === 'touch') {
                    handlePointer(e);
                }
            });
        }

        function updatePhysics(dt) {
            paddle.position.x += (targetPaddleX - paddle.position.x) * 22 * dt;

            if (isBallAttached) {
                ball.position.x = paddle.position.x;
                ball.position.z = paddle.position.z - 1.2;
                return;
            }

            ball.position.x += ballVel.x * dt;
            ball.position.z += ballVel.z * dt;

            // 좌우 벽 충돌
            const xLimit = ARENA_WIDTH / 2 - ball.radius;
            if (ball.position.x <= -xLimit) {
                ball.position.x = -xLimit;
                ballVel.x *= -1;
            } else if (ball.position.x >= xLimit) {
                ball.position.x = xLimit;
                ballVel.x *= -1;
            }

            // 상단 벽 충돌
            const topLimit = -ARENA_HEIGHT / 2 + ball.radius;
            if (ball.position.z <= topLimit) {
                ball.position.z = topLimit;
                ballVel.z *= -1;
            }

            // 패들 충돌
            const padZ = paddle.position.z;
            const padHalfW = paddle.width / 2;
            const padHalfD = paddle.depth / 2;

            if (ball.position.z + ball.radius >= padZ - padHalfD &&
                ball.position.z - ball.radius <= padZ + padHalfD &&
                ball.position.x >= paddle.position.x - padHalfW - ball.radius &&
                ball.position.x <= paddle.position.x + padHalfW + ball.radius &&
                ballVel.z > 0) {

                ball.position.z = padZ - padHalfD - ball.radius;
                const hitOffset = (ball.position.x - paddle.position.x) / padHalfW;
                const bounceAngle = hitOffset * (Math.PI / 3.2);

                const currentSpeed = ballVel.length();
                ballVel.x = Math.sin(bounceAngle) * currentSpeed;
                ballVel.z = -Math.cos(bounceAngle) * currentSpeed;
            }

            // 블록 충돌
            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                const dx = ball.position.x - b.x;
                const dz = ball.position.z - b.z;
                const overlapX = (b.halfW + ball.radius) - Math.abs(dx);
                const overlapZ = (b.halfD + ball.radius) - Math.abs(dz);

                if (overlapX > 0 && overlapZ > 0) {
                    if (overlapX < overlapZ) {
                        ballVel.x *= -1;
                        ball.position.x += (dx > 0 ? overlapX : -overlapX);
                    } else {
                        ballVel.z *= -1;
                        ball.position.z += (dz > 0 ? overlapZ : -overlapZ);
                    }

                    createCrumbExplosion(b.x, b.z, b.color);
                    scene.remove(b.group);
                    blocks.splice(i, 1);

                    score += 150;
                    document.getElementById('score-val').innerText = score.toString().padStart(6, '0');

                    if (blocks.length === 0) {
                        showGameOver("STAGE CLEARED!", "모든 비스킷 블록을 부수었습니다!");
                    }
                    break;
                }
            }

            // 하단 탈락
            if (ball.position.z > ARENA_HEIGHT / 2 + 1.5) {
                lives--;
                document.getElementById('lives-val').innerText = lives;
                if (lives > 0) {
                    resetBall();
                } else {
                    showGameOver("GAME OVER", "다시 도전해보세요!");
                }
            }
        }

        function showGameOver(title, sub) {
            isRunning = false;
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-sub').innerHTML = sub;
            document.getElementById('start-btn').innerText = "PLAY AGAIN";
            document.getElementById('msg-overlay').style.display = "flex";
        }

        function startGame() {
            score = 0;
            lives = 3;
            document.getElementById('score-val').innerText = "000000";
            document.getElementById('lives-val').innerText = "3";
            document.getElementById('msg-overlay').style.display = "none";
            spawnBlocks();
            resetBall();
            isRunning = true;
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            startGame();
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.033);

            if (isRunning) {
                updatePhysics(dt);
            }
            updateParticles(dt);

            renderer.render(scene, camera);
        }

        initScene();
        animate();
    </script>
</body>
</html>
